i, V03\nCaption — proposed: The connection doesn’t erase the differences.\n\n\nEXACT QUOTE Q04\n“The community, and support of the community, is just terribly important to me.”\n— Keith Polaski, V03\nCaption — proposed: Community is part of the foundation Keith is building.\n\n\nEXACT QUOTE Q05\n“There's a horizon that continues to move away from you.”\n— Keith Polaski, V03\nCaption — proposed: Keith’s reminder that the path continues. Share the complete clip alongside this card when possible.\n\n\nEXACT QUOTE Q06\n“That's ZeroBooze. Simple and true.”\n— Keith Polaski, V01\nCaption — proposed: A personal beginning. A shared ambition for life without alcohol.\n\n\nEXACT QUOTE Q07\n“I'm in this to help people find and embrace a life without alcohol.”\n— Keith Polaski, V04\nCaption — proposed: The purpose Keith keeps coming back to.\n\n\nEXACT QUOTE Q08\n“It's easy because it's the truth.”\n— Keith Polaski, V04\nCaption — proposed: Keith on speaking honestly about why he’s building ZeroBooze. This refers to telling the truth, not to recovery being easy.\n\n\nBRAND REFLECTIONS — new copy, not Keith quotations\nYour story doesn’t have to look like someone else’s to belong here. [V02/V03]\nYou can ask a question before you have an answer. [E32/V04]\nA shared thread. Room for your whole story. [V03]\nYour terms. Your path. Someone to walk with you. [V01]\nWhat helped you might be useful to someone else. [E32/V03]\nConnection can begin with a simple hello. [W01/E32]\n\n\nUse these as brand statements or prompts. Do not put them in quotation marks with Keith’s name.\n\n\n21C. Factoids, success stories, and the content calendar\nFACTOID F01 — safe brand fact\nZeroBooze began in the early days of Keith’s sobriety.\nSource: E23 and approved founder-history review.\nCaption — proposed: A personal experience started the brand. Your experience can help shape what comes next.\nDo not infer an exact founding date or sobriety date from this.\n\n\nFACTOID F02 — founder background\nKeith co-founded radius financial group in 1999.\nSource: P01, radius advisory-board site; confirm preferred current role.\nUse sparingly in founder content; experience in business is not a clinical credential.\n\n\nFACTOID F03 — developing vision\nKeith’s plan includes community, future recovery/relief centers, events, and a charitable foundation.\nSources: V04/E20/E39.\nCaption — proposed: There’s more to the vision. We’ll share each part as it develops.\nAlways retain the future status.\n\n\nFACTOID F04 — participation principle\nKeith wants content for different experiences without labeling individuals.\nSource: V02.\nCarousel — proposed: Different stages / Different reasons / Useful perspectives / Your story remains yours.\n\n\nSTATISTICS RESEARCH QUEUE — do not publish yet\nMarket figures and competitor claims from E17; duration-history claims from E25/E29; comparative outcomes from E39. Each needs a reliable source, definition, date, and review. The supplied transcripts do not verify these claims. Do not manufacture statistics just to fill a factoid slot.\n\n\nSUCCESS-STORY STATUS\nNo independently documented, consented ZeroBooze participant success story is supplied. Keith’s story is a founder perspective, not evidence of a ZeroBooze program result. The emails suggest possible storytellers and a tattoo-related community connection; identities, permissions, and details remain to be confirmed. [E03/E04/E08]\n\n\nSTORY SERIES — proposed label: “A Path of My Own”\nInterview prompts:\nWhat was happening in your life when alcohol-free living became important to you?\nWhat helped you choose a next step?\nWhat was one ordinary change that mattered?\nWho or what supported you?\nWhat is still difficult?\nWhat would you tell someone who is quietly asking questions?\nWhat do you want kept private?\nHow do you want your name, photograph, or voice used?\n\n\nSTORY TEMPLATE\nWorking title: [In the participant’s own words]\nName or chosen attribution: [Blank]\nExperience and date: [Blank]\nBefore / turning point / what helped / life now / continuing challenges: [Blank]\nExact approved quote: [Blank]\nRelationship to ZeroBooze: [Blank; do not imply care was received]\nSource interview and timecodes: [Blank]\nConsent for words / image / video / channels / reuse: [Blank]\nFactual review and approval: [Blank]\nCaption and CTA: [Draft only after interview]\n\n\nUse stories with nuance. Do not invent a tidy ending, suppress continuing difficulty, or generalize a personal result into a promise for others. Publication requires the person’s permission, not just a submitted message.\n\n\nFOUR-WEEK STARTER CALENDAR — proposed\nWeek 1: C02 “On your terms”; Q01 no labels; prompt “What would have helped you at the beginning?”\nWeek 2: C08 “That’s me”; Q03 shared thread; resource spotlight with verified original link.\nWeek 3: C11 founder purpose; F02 founder background; an actual development update.\nWeek 4: C05 different reasons; Q04 community; a consented community story if ready, otherwise an invitation to contribute.\n\n\nThree items per week is a proposed starting rhythm, not a posting commitment. Adapt rather than repeating the exact same post on every channel. Review response quality and what people find useful. No posts or schedules are published by this document update.\n\n\n22. Keith Polaski — bio development\nBIO PURPOSE\nBegin a factual bio record for About, press, partnerships, speaking, and eventual investor materials. Keep the website story personal; use the professional bio where context and credibility are needed. The older emails questioned a standard resume-style bio. This new section follows Dave’s request while preserving that distinction. [E29/E30]\n\n\nVERIFIED FOUNDATION\nFounder of ZeroBooze: established by emails, current website, and supplied transcripts. [E23/E32/W02/V01–V04]\nCo-founder of radius financial group: identified by the organization’s advisory-board site, which dates the company’s founding to 1999. [P01]\nMilitary background: identified by the same official site. Branch, rank, dates, and assignments are not supplied. [P01]\nBusiness-building experience: reflected in the emails, existing founder story, and V04. No clinical credentials are established by these sources.\nPersonal purpose: Keith says he wants to help people find and embrace life without alcohol. [V04]\nRecovery status and timing: personal details require Keith’s current review; historical wording should not be treated as a live sobriety counter.\n\n\nSHORT BIO — proposed\nKeith Polaski is the founder of ZeroBooze, a developing lifestyle brand and community around life without alcohol. Drawing on his own experience with sobriety and years of building businesses, he wants to create useful ways for people to connect, find support, and follow a path that belongs to them. He also co-founded radius financial group in 1999.\nSources: E23/E32/W02/V01/V04; career sentence P01.\nReview: confirm current titles, preferred brand spelling, and comfort with personal wording.\n\n\nEXTENDED BIO — proposed\nKeith Polaski founded ZeroBooze in the early days of his own sobriety. After years spent building businesses, he began working on something more personal: a brand and community shaped around life without alcohol.\n\n\nZeroBooze grows from a belief that people own their story and their path. Keith wants it to offer connection, useful perspectives, and room for experiences that differ from his own. He is particularly focused on people in recovery and people who are privately beginning to question the role alcohol plays in their lives.\n\n\nKeith co-founded radius financial group in 1999. Its advisory-board site also identifies his military background.\n\n\nAt ZeroBooze, he hopes to apply his experience as a builder to a broader vision that includes community, future recovery and relief centers, and other ways to support alcohol-free living. Those plans are still developing. His intention is to help people find and embrace life without alcohol on their own terms.\nSources: E23/E32/V01/V02/V04; professional facts P01.\nThis is a proposed biography, not a claim of clinical expertise, an operational care network, or registered charitable status.\n\n\nFIRST-PERSON INTRO — proposed\nI’ve spent years building businesses. ZeroBooze is the most personal thing I’ve tried to build.\n\n\nIt started in my own sobriety, with a need to find something useful and a reason to keep building. I want it to become a community where people can connect, explore life without alcohol, and follow a path that belongs to them.\n\n\nMy experience is where this began. Your story can help shape what comes next.\nSources: W02/E32/V01/V03/V04. This is new draft language, not a transcript quotation.\n\n\nQUESTIONS FOR KEITH — fill-in record\nPreferred name and current titles: [________________]\nHow should we describe your present relationship to radius? [________________]\nWhat year did your mortgage / business career begin? [________________]\nWhich roles and companies should appear in a professional bio? [________________]\nMilitary branch, years of service, rank, and relevant experience you want public: [________________]\nEducation, qualifications, and professional associations worth including: [________________]\nWhich awards or business milestones matter—and where can we verify them? [________________]\nWhen did ZeroBooze become an idea, and when was the company formally established? [________________]\nWhat does “40-plus years in the making” mean to you? [________________]\nDo you want a sobriety date or specific recovery timeline published? If so, what wording? [________________]\nWhich personal details, names, or earlier experiences should remain private? [________________]\nWhat would you like to say about family, faith, or the people who supported you? [________________]\nWhich charitable or community activities predate ZeroBooze? [________________]\nWhat are you proud of professionally that helps explain your approach here? [________________]\nWhat do you want readers to understand about your role versus future clinical professionals? [________________]\nWhat is your primary focus at ZeroBooze right now? [________________]\nHow should we describe your current geographic base without exposing a private address? [________________]\nWhat do you want the bio to sound like when you read it aloud? [________________]\nApproved portrait, photo credit, press contact, and version date: [________________]\n\n\nDo not republish the private agreement address, assume a current executive role from an old page, or infer military details or degrees. Invite Keith to correct the record before any public use.\n\n\n23. Transcript implications and new source register\nWHAT THE TRANSCRIPTS ADD\nOwnership is a direct founder theme, not only an interpretation of emails. [V01/V03/V04]\nThe community should encourage recognition through different stories. [V03]\nInternal audience segmentation should not become labels imposed on visitors. [V02]\nGiving back and helping people are explicit motivations. They do not establish nonprofit status or free offerings. [V04]\nBusiness experience is relevant to building the experience, while future centers and a foundation remain plans. [V04]\n“40-plus years in the making” needs personal clarification rather than being used as a corporate age claim. [V01]\nThe words “silently concerned” in the transcripts differ from “Quietly Concerned” in the September notes. Maintain the latter as the working written label until Keith confirms; keep quotes faithful. [V02/V04 vs. E32]\n\n\nHOW THIS AFFECTS EXISTING COPY\nSections 3 and 10: keep audience categories in internal planning; explain the public invitation in ordinary language rather than requiring self-classification.\nHome: “on your terms” and “someone to walk with you” now have direct transcript support. [V01]\nAbout and bio: keep founder experience as context, then return to the visitor. [V01/V03]\nCommunity: use shared stories to create recognition; do not promise recovery outcomes from participation. [V03]\nHorizon: continue labeling centers, events, sponsorship, and the foundation as development plans. [V04]\nStore: personal purpose does not imply purchases fund a charity. [V04]\n\n\nTRANSCRIPT SOURCES — supplied and read in full\nV01 — ZeroBooze_Intro_Video_v2.txt\nSource: https://chatgpt.com/api/library/files/libfile_0e52a8968a948191be84748fa56109b2/download\nAsset label: Intro Video v2. Runtime listed in transcript: 1:43. No timecodes.\n\n\nV02 — Who_is_ZeroBooze_For.txt\nSource: https://chatgpt.com/api/library/files/libfile_e63c36e45efc819186ba6fea0a2fd3ba/download\nAsset label: Who is ZeroBooze For. Runtime listed: 1:37. No timecodes.\n\n\nV03 — ZB_Community_v1.txt\nSource: https://chatgpt.com/api/library/files/libfile_7c2405e0c6a08191a8be60f31c5ea6fe/download\nAsset label: ZB Community v1. Runtime listed: 1:11. No timecodes.\n\n\nV04 — A_Pledge_v1.txt\nSource: https://chatgpt.com/api/library/files/libfile_b39109f27a5481918376c98a1681ebd9/download\nAsset label: A Pledge v1. Runtime listed: 1:19. Opening marked unclear. No timecodes.\n\n\nPUBLIC BIO SOURCES\nP01 — radius financial group advisory-board site\nhttps://www.radiusadvisoryboard.com/\nReviewed October 13, 2026. Establishes Keith’s co-founder identity, military background, and the company’s 1999 founding. Includes older strategy material; current titles and figures require confirmation. Avoid reusing undated employee counts as current.\n\n\nP02 — The Boston Globe, Paul E. Kandarian, February 12, 2016\nhttps://www.bostonglobe.com/metro/regionals/south/2016/02/12/norwell-based-mortgage-lender-among-fastest-growing-massachusetts/GwxpVWDEUjneVkpHybwKlI/story.html\nHistorical press context: a 2016 profile interviewed Keith about radius’s growth. Not used for current company statistics or clinical credentials.\n\n\nP03 — LinkedIn, supplied link\nhttps://www.linkedin.com/in/keith-polaski-3564b1/?isSelfProfile=false\nProfile content was not retrievable in this review. No titles, dates, education, or credentials are drawn from it. Keith can provide profile text or answer the bio questions.\n\n\nTRANSCRIPTION / EDITING STATUS\nThe transcript content is now incorporated. The recordings themselves have not been independently played back or frame-reviewed. Validate exact clips, subtitles, cut points, and all timecodes against the master videos before production. The transcript runtime for V01 differs from the 1:10 Dropbox preview previously observed; confirm which video version the editor is using.\n"}</script>
<script>
const DATA=JSON.parse(document.getElementById('hub-data').textContent),items=DATA.items;
const $=s=>document.querySelector(s),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadLocal(){try{return JSON.parse(localStorage.getItem('zb-hub-workspace-v1')||'{}')}catch{return {}}}let local=loadLocal();local.saved=local.saved||[];local.notes=local.notes||{};local.answers=local.answers||{};let page='overview',query='',type='All types',status='All statuses',category='All sections',timer;
function persist(){try{localStorage.setItem('zb-hub-workspace-v1',JSON.stringify(local))}catch{toast('Browser storage is unavailable. Export your work to keep it.')}}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('#toast').style.display='none',2600)}
const navs=[['overview','01','Overview'],['Strategy','02','Brand foundation'],['Website copy','03','Website copy'],['Social & editorial','04','Social & editorial'],['Inspirational Quotes','✦','Inspirational quotes'],['Keith’s bio','05','Keith’s bio'],['Partnerships','06','Partnerships'],['Workflow','07','Questions & workflow'],['Sources','08','Sources & assets'],['saved','☆','My collection']];
function setPage(p){page=p;query='';$('#search').value='';type='All types';status='All statuses';category='All sections';render();history.replaceState(null,'','#'+encodeURIComponent(p));window.scrollTo({top:0,behavior:'smooth'})}
function nav(){ $('#nav').innerHTML=navs.map(([p,n,t])=>`<button class="${page===p&&!query?'active':''}" data-page="${escape(p)}" ${page===p&&!query?'aria-current="page"':''}><span>${n}</span>${t}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('#crumb').textContent=query?'Search results':navs.find(x=>x[0]===page)?.[2]||'Resource center';$('#master-link').href=DATA.documentUrl}
function excerpt(i){let s=i.body.replace(/https?:\/\/\S+/g,'').replace(/\[[^\]]*\]/g,'').split('\n').filter(x=>x.trim()&&!/^(Source|Editorial|Status|Caption|Target|Added|Reviewed|Exact|Locate)/i.test(x)&&x!==x.toUpperCase()).join(' ');return s.slice(0,170)+(s.length>170?'…':'')}
function cards(list){return list.length?list.map(i=>`<article class="card"><div class="card-top"><span class="type">${escape(i.type)} · ${escape(i.id.replace('section-','§ '))}</span><button class="star ${local.saved.includes(i.id)?'saved':''}" data-save="${i.id}" aria-label="${local.saved.includes(i.id)?'Remove from':'Add to'} my collection">${local.saved.includes(i.id)?'★':'☆'}</button></div><button class="card-title" data-open="${i.id}">${escape(i.title)}</button><p class="excerpt">${escape(excerpt(i))}</p><div class="card-bottom"><span class="badge ${/Needs|Review|development/.test(i.status)?'warning':''}">${escape(i.status)}</span><button class="open" data-open="${i.id}">Open resource ↗</button></div></article>`).join(''):'<div class="empty">No matching resources. Try another search or clear your filters.</div>'}
function bind(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openItem(b.dataset.open));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveItem(b.dataset.save));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setPage(b.dataset.go));document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>jumpToResource(b.dataset.jump));document.querySelectorAll('[data-copy-inline]').forEach(b=>b.onclick=()=>{const i=items.find(i=>i.id===b.dataset.copyInline);copy(i.title+'\n\n'+i.body)});document.querySelectorAll('[data-download-inline]').forEach(b=>b.onclick=()=>{const i=items.find(i=>i.id===b.dataset.downloadInline);download(i.id+'-resource.txt',i.title+'\n\n'+i.body)});document.querySelectorAll('[data-inline-note]').forEach(t=>t.oninput=()=>{local.notes[t.dataset.inlineNote]=t.value;persist()});document.querySelectorAll('[data-source-inline]').forEach(b=>b.onclick=()=>{const panel=b.closest('.reader-meta').querySelector('.inline-source-preview');panel.innerHTML=rich(sourceFor(b.dataset.sourceInline))});const cp=document.getElementById('copy-reading-page');if(cp)cp.onclick=()=>{const ids=JSON.parse(cp.dataset.ids);copy(ids.map(id=>{const i=items.find(i=>i.id===id);return i.title+'\n\n'+i.body}).join('\n\n————————\n\n'))}}
function saveItem(id){const y=window.scrollY;local.saved=local.saved.includes(id)?local.saved.filter(x=>x!==id):[...local.saved,id];persist();render();window.scrollTo(0,y);toast(local.saved.includes(id)?'Added to your collection on this browser.':'Removed from your collection.')}
function heading(t,desc,eyebrow='WORKING RESOURCE CENTER'){return `<div class="page-title-row"><div><div class="eyebrow">${eyebrow}</div><h1>${t}</h1><p class="lead">${desc}</p></div><a class="btn secondary" href="${DATA.documentUrl}" target="_blank" rel="noopener">Master document ↗</a></div>`}
function overview(){const mission=items.find(i=>i.id==='brand-mission'),vision=items.find(i=>i.id==='brand-vision');const first=i=>i.body.replace(/^PROPOSED BRAND FOUNDATION[^\n]*\n[^\n]*\n\n/,'').split(/\n\s*\n/)[0];const rows=[['Strategy','01','Brand foundation','Purpose, mission, vision, values, pillars, voice, and manifesto—all readable in one place.'],['Website copy','02','Website copy','Read the eight page drafts in sequence, including modules, CTAs, and editorial notes.'],['Social & editorial','03','Social & editorial','Browse clip briefs, captions, factoids, story ideas, and the starting calendar.'],['Inspirational Quotes','04','Inspirational quotes','Founder excerpts and the End game theme, with attribution close to each quote.'],['Keith’s bio','05','Keith’s bio','Read the proposed bios, verified background, and questions for Keith.'],['Partnerships','06','Partnerships','Partner positioning, future recruitment, and the investor workstream.'],['Workflow','07','Questions & workflow','Review open inputs, approval steps, and source-grounded decisions.'],['Sources','08','Sources & assets','Find source records, original document links, and the supplied logo downloads.']];return `<div class="reading-hero"><div class="eyebrow">ZeroBooze / The content hub</div><h1>The thinking and the words,<br>in one place.</h1><p>A working resource for the people building ZeroBooze. Read the content directly, jump to a section, or search for the phrase you need.</p><div class="actions"><button class="btn" data-go="Strategy">Read the brand foundation →</button><button class="btn secondary" data-go="Website copy">Read website copy</button></div></div><section class="overview-feature"><div><span class="eyebrow">Mission · proposed</span><h2>What we are here to do.</h2><p>${escape(first(mission))}</p><button class="text-link" data-open="brand-mission">Read the full mission ↓</button></div><div><span class="eyebrow">Vision · proposed</span><h2>The future we want to help create.</h2><p>${escape(first(vision))}</p><button class="text-link" data-open="brand-vision">Read the full vision ↓</button></div></section><div class="section-head"><div><h2>Explore the hub.</h2><p>Each section opens as a readable page, with its content already visible.</p></div></div><div class="section-directory">${rows.map(([p,n,t,desc])=>`<button class="directory-row" data-go="${escape(p)}"><span class="directory-number">${n}</span><strong>${t}</strong><span class="directory-description">${desc}</span><span class="arrow">↗</span></button>`).join('')}</div><div class="reading-intro"><strong>A working foundation.</strong>New strategic language and public copy remain subject to review. Confirmed brand rules, evidence labels, future plans, and source notes stay attached to the content. Bookmarks and unsent drafts save only on this browser. Feedback you send is saved for the team.</div>`}
const descriptions={'Inspirational Quotes':['Words to carry forward.','Inspirational themes and founder excerpts for content development. Source, attribution, and review status stay with every quote.'],'Strategy':['The brand foundation.','Purpose, mission, vision, values, positioning, pillars, and the words that bring them to life. Proposed strategic language for Keith’s review, alongside confirmed brand rules.'],'Website copy':['The website, in words.','Eight page drafts with their intended modules, calls to action, source notes, and missing inputs.'],'Social & editorial':['Good content starts here.','Founder clips, exact quote cards, factoids, captions, story prompts, and a practical starting calendar.'],'Keith’s bio':['A personal beginning.','Bio drafts and a factual foundation for press, partnerships, and the website. Personal details stay subject to Keith’s review.'],'Partnerships':['Build the right connections.','Working language for partners, future recruitment, and a separate investor workstream.'],'Workflow':['Make the next decision clear.','Open inputs, evidence labels, review steps, and questions that will make the content stronger.'],'Sources':['Keep the source close.','The complete evidence register, transcript references, and original project assets.'],'saved':['Your working collection.','Keep useful resources together. Bookmarks and notes are saved on this browser only. Export to share them.']};
function filters(base){const types=[...new Set(base.map(x=>x.type))],statuses=[...new Set(base.map(x=>x.status))];return `<div class="filters"><select id="type-filter" aria-label="Filter content type">${['All types',...types].map(v=>`<option ${v===type?'selected':''}>${escape(v)}</option>`).join('')}</select><select id="status-filter" aria-label="Filter review status">${['All statuses',...statuses].map(v=>`<option ${v===status?'selected':''}>${escape(v)}</option>`).join('')}</select>${query?`<select id="category-filter" aria-label="Filter section">${['All sections',...[...new Set(items.map(x=>x.category))]].map(v=>`<option ${v===category?'selected':''}>${escape(v)}</option>`).join('')}</select>`:''}<button class="btn secondary" id="clear-filters">Reset</button><span class="counter" id="count"></span></div>`}
function language(){const body=DATA.sections.find(s=>s.section==='5').body;const list=body.split('Avoid → Keith’s preferred wording\n')[1].split('Additional explicit preferences')[0].trim().split('\n').filter(x=>x.includes('→'));return `<div class="section-head"><div><h2>The language guide.</h2><p>Keith’s recorded preferences. Context matters; this is not an automatic word swap.</p></div><button class="btn secondary" data-open="section-5">Read full guidance ↗</button></div><div class="guide"><table><thead><tr><th>Avoid / earlier wording</th><th>Keith’s preferred wording</th></tr></thead><tbody>${list.map(x=>{const p=x.split('→');return `<tr><td>${escape(p[0])}</td><td>${escape(p[1])}${/Outcome|Days|Pay|Post Care|Modalities|Rules/.test(x)?'<span class="badge warning" style="margin-left:10px">Verify before public use</span>':''}</td></tr>`}).join('')}</tbody></table></div>`}
function calendar(){const weeks=[['C02','Q01','What would have helped you at the beginning?'],['C08','Q03','Resource spotlight with a verified original link.'],['C11','F02','An actual development update.'],['C05','Q04','A consented story, or an invitation to contribute.']];return `<div class="section-head"><div><h2>Four weeks to start.</h2><p>A proposed rhythm. All items need review before production and posting.</p></div><button class="btn secondary" data-open="calendar">Open calendar notes ↗</button></div><div class="calendar">${weeks.map((w,i)=>`<div class="week"><div class="eyebrow">WEEK</div><div class="num">0${i+1}</div>${w.slice(0,2).map(id=>`<button data-open="${id}">${id} · ${escape(items.find(x=>x.id===id).title)} ↗</button>`).join('')}<p>${escape(w[2])}</p><small>3 proposed content moments</small></div>`).join('')}</div>`}
function questions(){const b=items.find(x=>x.type==='Questionnaire');const qs=b.body.split('\n').filter(x=>x.includes('[________________]')).map(x=>x.split(': [')[0]);return `<div class="section-head"><div><h2>Questions for Keith.</h2><p>Answers save locally on this browser. Export them to send to the team.</p></div><button class="btn secondary" id="export-answers">Export answers ↓</button></div>${qs.map((q,i)=>`<div class="question"><label for="answer-${i}">${escape(q)}</label><textarea id="answer-${i}" data-question="${i}" placeholder="Add Keith’s answer…">${escape(local.answers[i]||'')}</textarea></div>`).join('')}`}

function render(){nav();let html;if(!query&&page==='overview'){html=overview()}else{let desc=descriptions[page]||['Find your next resource.','Search across the entire working document.'];let base=query?items.filter(i=>(i.title+' '+i.body+' '+i.id+' '+i.category).toLowerCase().includes(query.toLowerCase())):page==='saved'?items.filter(i=>local.saved.includes(i.id)):items.filter(i=>i.category===page||(page==='Inspirational Quotes'&&i.type==='Quote card'));let result=base.filter(i=>(type==='All types'||i.type===type)&&(status==='All statuses'||i.status===status)&&(category==='All sections'||i.category===category));html=heading(query?'Find what you need.':desc[0],query?`Results for “${escape(query)}” across all sections.`:desc[1],query?'SEARCH THE HUB':'ZeroBooze / '+escape(page).toUpperCase());if(page==='saved'&&!query)html+='<div class="actions"><button class="btn" id="export-collection">Export collection & notes ↓</button></div>';if(!query&&page==='Strategy')html+='<div class="notice"><strong>Proposed brand foundation · October 26, 2026.</strong> New mission, vision, values, pillars, and manifesto are ready for Keith’s review. Confirmed spelling and language rules remain in place. Read the complete language below. Copy any section, expand its source context, or add review notes as you go.</div>';html+=filters(base)+readerPage(result);if(!query&&page==='Social & editorial')html+=calendar();if(!query&&['Keith’s bio','Workflow'].includes(page))html+=questions();if(!query&&page==='Sources')html+=assets();html+='<footer>Working content for review · October 26, 2026. This hub preserves the source document’s evidence and approval distinctions. Unsent drafts and bookmarks remain on this browser. Sent feedback and answers are saved for the team; submissions are not automatic approvals.</footer>';$('#content').innerHTML=html;$('#count').textContent=result.length+' resources';}if(!query&&page==='overview')$('#content').innerHTML=html;bind();if($('#type-filter'))$('#type-filter' function rich(body){const linkify=p=>escape(p).replace(/(https?:\/\/[^\s&<>]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);return body.split(/\n\s*\n/).filter(x=>x.trim()).map(p=>{const lines=p.split('\n'),first=lines[0].trim();if(first.length<160&&first===first.toUpperCase()&&/[A-Z]/.test(first)){return `<h3 class="subhead">${escape(first)}</h3>${lines.length>1?`<p>${linkify(lines.slice(1).join('\n'))}</p>`:''}`}return `<p>${linkify(p)}</p>`}).join('')}
function findSources(i){return [...new Set((i.body+' '+i.title).match(/\b(?:E\d{2}|V\d{2}|W\d{2}|P\d{2})\b/g)||[])]}
function sourceFor(id){const all=DATA.sections.find(s=>s.section==='20').body+'\n'+DATA.sections.find(s=>s.section==='23').body;let re=new RegExp('(?:^|\\n)'+id+' — ([\\s\\S]*?)(?=\\n(?:E\\d{2}|V\\d{2}|W\\d{2}|P\\d{2}|ATTACHMENT|TRANSCRIPTION|PUBLIC BIO|AUDIO RECEIVED) — |$)');let m=all.match(re);return m?m[0].trim():id+' — See the full source register in Sections 20 and 23.'}
function jumpToResource(id){let el=document.getElementById('read-'+id);if(!el)return;const older=el.closest('details.reader-legacy');if(older)older.open=true;el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('jump-highlight');setTimeout(()=>el.classList.remove('jump-highlight'),1600);const title=el.querySelector('h2');title.focus({preventScroll:true})}
function openItem(id){const i=items.find(x=>x.id===id);if(!i)return;if(!document.getElementById('read-'+id))setPage(i.category);requestAnimationFrame(()=>jumpToResource(id))}
function readerResource(i){let body=i.body,source='',context='';if(body.startsWith('PROPOSED BRAND FOUNDATION')){const p=body.indexOf('\n\n');context=body.slice(0,p);body=body.slice(p+2)}const mark=body.indexOf('\n\nSOURCE BASIS\n');if(mark>=0){source=body.slice(mark+2);body=body.slice(0,mark)}const refs=findSources(i);return `<section class="reader-section" id="read-${i.id}"><div class="reader-heading"><div><span class="reader-label">${escape(i.type)}</span><h2 tabindex="-1">${escape(i.title)}</h2><span class="badge ${/Needs|Review|review|development/.test(i.status)?'warning':''}">${escape(i.status)}</span></div><div class="reader-tools"><button data-copy-inline="${i.id}">Copy</button><button data-download-inline="${i.id}" aria-label="Download ${escape(i.title)}">Text ↓</button><button data-save="${i.id}" aria-pressed="${local.saved.includes(i.id)}">${local.saved.includes(i.id)?'★ Saved':'☆ Save'}</button></div></div><div class="reader-prose prose">${rich(body)}</div>${context||source||refs.length?`<details class="reader-meta"><summary>Source context & references${refs.length?' · '+refs.join(', '):''}</summary>${context?`<p>${escape(context)}</p>`:''}${source?`<div class="prose">${rich(source)}</div>`:''}${refs.map(r=>`<button class="source-chip" data-source-inline="${r}">${r} ↗</button>`).join('')}<div class="inline-source-preview prose"></div></details>`:''}<details class="review-fold" ${local.notes[i.id]?'open':''}><summary>Your review notes${local.notes[i.id]?' · note saved':''}</summary><small>Saved on this browser only. Export your collection to share notes with the team.</small><textarea aria-label="Review notes for ${escape(i.title)}" data-inline-note="${i.id}" placeholder="Add a question, edit, or production note…">${escape(local.notes[i.id]||'')}</textarea></details></section>`}
function readerPage(list){if(!list.length)return '<div class="empty">No matching content. Try another search or reset the filters.</div>';let main=list,legacy=[];if(!query&&page==='Strategy'){main=list.filter(i=>i.id.startsWith('brand-')||i.id==='section-5');legacy=list.filter(i=>!main.includes(i))}const all=[...main,...legacy];return `<div class="reader-layout"><div class="reader-stream">${main.map(readerResource).join('')}${legacy.length?`<details class="reader-legacy"><summary>Earlier strategy & source notes · ${legacy.length} resources</summary><p>Previous working interpretations and decision history, preserved for reference.</p>${legacy.map(readerResource).join('')}</details>`:''}</div><details class="page-index" ${window.matchMedia('(min-width: 901px)').matches?'open':''}><summary>ON THIS PAGE</summary><span class="index-total">${all.length} readable sections</span>${all.map(i=>`<button data-jump="${i.id}">${escape(i.title)}</button>`).join('')}<button class="copy-page" id="copy-reading-page" data-ids="${escape(JSON.stringify(all.map(i=>i.id)))}">Copy this page ↓</button><button data-jump="${main[0].id}">Back to first section ↑</button></details></div>`}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Resource copied with its source and review context.')}catch{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();const ok=document.execCommand('copy');a.remove();toast(ok?'Resource copied.':'Use Download text to keep this resource.')}}
function download(name,t){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportWork(collection){let t='ZeroBooze — '+(collection?'MY COLLECTION & REVIEW NOTES':'QUESTIONS FOR KEITH')+'\nExported '+new Date().toLocaleDateString()+'\nWorking notes; not an approval record.\n\n';if(collection){let ids=[...new Set([...local.saved,...Object.keys(local.notes).filter(id=>local.notes[id])])];t+=ids.map(id=>{const i=items.find(x=>x.id===id);return i?i.title+'\n'+i.body+'\n\nREVIEW NOTE: '+(local.notes[id]||'[None]'):''}).join('\n\n'+'—'.repeat(40)+'\n\n')}const q=items.find(x=>x.type==='Questionnaire').body.split('\n').filter(x=>x.includes('[________________]'));t+='\n\nQUESTIONS FOR KEITH\n'+q.map((x,i)=>x.split(': [')[0]+'\n'+(local.answers[i]||'[Awaiting answer]')).join('\n\n');download(collection?'ZeroBooze-Collection-and-Notes.txt':'ZeroBooze-Keith-Answers.txt',t);toast('Export downloaded. Share the file when you’re ready.')}
$('#close').onclick=()=>$('#detail').close();$('#detail').onclick=e=>{if(e.target===$('#detail')){const r=$('#detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#detail').close()}};$('#search').oninput=e=>{query=e.target.value;type='All types';status='All statuses';category='All sections';render()};document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#search').focus()}});try{const p=decodeURIComponent(location.hash.slice(1));if(navs.some(x=>x[0]===p))page=p}catch{}render();
</script><script src="feedback.js"></script></body></html>
