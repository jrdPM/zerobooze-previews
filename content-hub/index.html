very listed live offering. Consider the public navigation label “Support” while clinical services are still in development.\n\n\nHERO\nSupport for a path that’s yours.\n\n\nPeople need different things at different moments. A useful resource. A new perspective. A connection. Sometimes, professional support.\n\n\nZeroBooze is developing ways to help people navigate those needs while keeping ownership of their own story.\n\n\nSources: E20/E32.\n\n\nAVAILABLE WAYS TO CONNECT — publish only when working\nExplore Resources\nFind reflections and selected resources for life without alcohol. Start with what feels relevant to you.\nButton: Browse Resources\n\n\nStart a Conversation\nHave a question, a thought, or something you’d like to share? A short note is enough. You decide how much to tell us.\nButton: Contact ZeroBooze\n\n\nFollow Along\nGet occasional updates as the community and broader vision develop.\nButton: Receive Updates\n\n\nSources: E24/E32; W01. These are participation functions, not clinical counseling. Response times and availability are not promised.\n\n\nIN DEVELOPMENT\nA wider vision for support.\n\n\nOur plans include residential recovery, virtual professional support, and continued support beyond a residential stay. We’re also exploring ways to connect people with resources and others who understand their experience.\n\n\nThese offerings are in development. This page is not an invitation to book clinical or residential services.\n\n\nButton: Explore Our Horizon\nSources: E20/E32/E39. Confirm exact scope and terminology before launch.\n\n\nSERVICE-PAGE TEMPLATE — reuse when an offering is verified\nService name / who it is for / what it includes / provider or team / format and location / availability / cost and payment / exclusions / next step / supporting credentials / date verified.\n\n\nSEO — proposed\nTitle: Support and Future Services | ZeroBooze\nDescription: Explore ways to connect with ZeroBooze and learn about the recovery and support offerings in development.", "category": "Website copy", "type": "Page copy", "status": "In development", "section": "12"}, {"id": "section-13", "title": "Website copy — Resources", "body": "HERO\nUseful perspectives.\nRoom to find your own.\n\n\nLife without alcohol comes with questions. We’re building a collection of personal reflections, practical ideas, and selected resources to help you explore yours.\n\n\nStart where you are. Take what is useful.\n\n\nSources: E20/E24/E32.\n\n\nRESOURCE COLLECTIONS — proposed editorial categories\nThinking About a Change\nQuestions and perspectives for people beginning to look at their relationship with alcohol.\n\n\nLiving Without Alcohol\nEveryday experiences, routines, food, and connection. A life that can be shaped around what matters to you.\n\n\nFinding Support\nInformation about different kinds of support, with clear links to the people and organizations providing it.\n\n\nStories From the Community\nDifferent experiences, shared with permission and in each person’s own voice.\n\n\nAlong the Path\nNotes from Keith and the people helping shape ZeroBooze: what we’re learning, what’s developing, and what we’re still working through.\n\n\nSources: E19/E23/E24/E32. No resource collection is represented as populated until reviewed content exists.\n\n\nINVITATION\nSomething helped you?\nWe’d like to hear about it.\n\n\nA resource, a perspective, or an experience may be useful to someone else. Send us a suggestion. We’ll review it before sharing.\n\n\nButton: Suggest a Resource\nSources: E32; proposed implementation.\n\n\nRESOURCE EDITORIAL NOTE\nEach published resource needs an original source, purpose, intended audience, date checked, availability or geographic limits, author credentials where relevant, and a clear distinction between personal experience and professional guidance. Any sponsor or affiliate relationship must be identified. The word list’s appendix is a starting lead, not a checked directory.\n\n\nSEO — proposed\nTitle: Resources for Life Without Alcohol | ZeroBooze\nDescription: Explore personal reflections, practical ideas, and selected resources for life without alcohol, with room for your story and your next step.", "category": "Website copy", "type": "Page copy", "status": "Proposed copy", "section": "13"}, {"id": "section-14", "title": "Website copy — Store", "body": "HERO\nMake it yours.\n\n\nZeroBooze merchandise gives you a way to carry a connection into everyday life. Wear it with pride. Keep the meaning personal. Let it open a conversation.\n\n\nThe meaning is yours to make.\n\n\nSources: E22/E32; W01.\n\n\nSTORE INTRO\nA considered collection.\n\n\nWe’re starting with ZeroBooze merchandise and building from there. Each product page should tell you exactly what you’re choosing: materials, fit, colors, care, price, and delivery details.\n\n\nBrowse the collection and choose what suits you.\n\n\nEditorial note: the second paragraph is consumer-facing guidance; confirm it matches actual product-page detail. Do not use “premium,” manufacturer names, or quality guarantees without product evidence. The asset inventory lists wearables and other branded material, but inventory and availability need confirmation. [E08/E27/E31/E32]\n\n\nSAMPLE PRODUCT COPY — hat\nThe ZeroBooze Hat\nA simple way to carry something that matters to you.\n\n\n[Verified fabric and construction]\n[Verified size and adjustment]\n[Available colors]\n[Price]\n[Care instructions]\n[Shipping estimate and return policy]\nButton: Add to Bag\n\n\nCONNECTION MODULE\nMore than something to buy.\n\n\nThe store is one part of ZeroBooze. The larger purpose is connection, useful support, and a community around life without alcohol.\n\n\nButton: Meet ZeroBooze\nSources: E09/E22/E32.\n\n\nFUTURE PARTNER PRODUCTS\nBeverages, nutrition, affiliate relationships, and resale are exploratory in the September notes. Do not imply they are in stock, ZB-made, or formally endorsed. Do not promise a donation or foundation contribution from purchases without a verified mechanism.\n\n\nSEO — proposed\nTitle: ZeroBooze Store | Merchandise With Personal Meaning\nDescription: Explore ZeroBooze merchandise and choose something that expresses your connection to life without alcohol. View product details and availability.", "category": "Website copy", "type": "Page copy", "status": "Proposed copy", "section": "14"}, {"id": "section-15", "title": "Website copy — Contact", "body": "HERO\nA simple hello is enough.\n\n\nHave a question, an idea, or a story you’d like to share? Start with a note. You don’t have to explain everything.\n\n\nSources: E24/E32; W01.\n\n\nFORM INTRO\nWhat would you like to talk about?\n\n\nSuggested topics:\nGeneral question\nShare a story or resource\nPartnership or collaboration\nFuture opportunities\nStore or order question\n\n\nSuggested fields:\nName\nEmail address\nTopic\nMessage\n\n\nButton: Send My Note\n\n\nAcknowledgment — proposed:\nThanks for reaching out. We’ve received your note. We’ll respond as soon as we can.\n\n\nSources: E32. Use acknowledgment only after successful delivery. Do not promise a response window until one is agreed.\n\n\nUPDATES OPT-IN — separate, optional checkbox\nI’d like to receive occasional ZeroBooze updates by email.\n\n\nSTORY-SHARING NOTE — proposed\nSending us your story does not give us permission to publish it. If we’d like to share any part, we’ll ask you first.\n\n\nCONVERSATION SCOPE\nThis is for general questions and conversation. Replies are not immediate, and this channel is not monitored for urgent support.\n\n\nSources: W01; E32. Add a separate clinically reviewed urgent-help route if appropriate before launch. Do not invent a monitored crisis service.\n\n\nDIRECT TEXTING — hold until verified\nButton: Text ZeroBooze\nOpening message: Hi, welcome to ZeroBooze. You’re welcome to leave a question or a note. You decide how much to share. Replies aren’t immediate.\n\n\nKeep the brand in front; explain who handles messages where helpful. Do not expose Keith’s personal number or publish the billing address from the agreement as a residence address. [E32/E37]\n\n\nSEO — proposed\nTitle: Contact ZeroBooze | Questions, Stories and Connections\nDescription: Get in touch with ZeroBooze to ask a question, share a perspective, explore a collaboration, or learn about what’s developing.", "category": "Website copy", "type": "Page copy", "status": "Proposed copy", "section": "15"}, {"id": "section-16", "title": "Website copy — Horizon", "body": "HERO\nOur Horizon.\nWhat we’re working toward.\n\n\nZeroBooze begins with a belief: you own your story and your path to life without alcohol. Our ambition is to build more ways to support that path.\n\n\nSome pieces are already taking shape. Others are still ideas we’re working through. We’ll be clear about the difference.\n\n\nSources: E20/E32/E39.\n\n\nPLANNED AREAS\nPlaces for Recovery\nA vision for residential settings shaped around personal ownership, support, and the experience of the people who come there.\n\n\nMore Ways to Find Support\nExploring virtual professional support, continued connection, and resources for different stages of alcohol-free living.\n\n\nEveryday Life\nExploring products, partnerships, beverages, nutrition, and experiences that fit a life without alcohol.\n\n\nA Charitable Future\nA vision for a ZeroBooze charitable foundation. Its structure, purpose, and activities are still to be developed.\n\n\nCommunity That Grows With Us\nShared stories, meaningful connections, and opportunities to gather as the community takes shape.\n\n\nSources: E20/E32/E39. No implied service availability, charitable registration, tax deductibility, partner commitment, or launch schedule.\n\n\nINVITATION\nHelp shape what comes next.\n\n\nWhat would have helped you? What would help now? Your perspective can inform what we build.\n\n\nButton: Share Your Perspective\nSecondary button: Follow Our Progress\nSources: E32; proposed copy.\n\n\nSEO — proposed\nTitle: Our Horizon | The Future of ZeroBooze\nDescription: Explore ZeroBooze’s developing vision for community, recovery residences, support, everyday living, and a charitable future.", "category": "Website copy", "type": "Page copy", "status": "In development", "section": "16"}, {"id": "channel-plan", "title": "Channel roles & editorial rhythm", "body": "Proposed channel roles, informed by Keith’s Facebook, Instagram, YouTube, and Substack list [E28]:\nFacebook: conversation and community participation.\nInstagram: short stories, visual identity, useful prompts, everyday alcohol-free living.\nYouTube: founder introduction, thoughtful conversations, and longer stories.\nSubstack or a site-based publication: regular reflections and progress updates. Choose one primary publishing home before duplicating effort.\n\n\nThe platform list is Keith’s initial preference; no current account status or active audience is assumed. Begin with a sustainable cadence, proposed at one substantive note each week plus adaptations, and adjust to response. Keith says rhythm can follow the community. [E24/E32]", "category": "Social & editorial", "type": "Strategy", "status": "Proposed copy", "section": "17"}, {"id": "social-1", "title": "01 — introduction", "body": "ZeroBooze began with someone who needed it first. We’re building a community around life without alcohol—with room for different stories, different reasons, and a path that’s yours. Get to know what we’re building.\nCTA: Read Our Story\nSources: E23/E32.", "category": "Social & editorial", "type": "Social post", "status": "Proposed copy", "section": "17"}, {"id": "social-3", "title": "02 — quietly concerned", "body": "You don’t have to know exactly what comes next to start asking questions. If alcohol has been on your mind, there’s room for that conversation here.\nCTA: Explore Resources\nSources: E25/E32.", "category": "Social & editorial", "type": "Social post", "status": "Proposed copy", "section": "17"}, {"id": "social-5", "title": "03 — community", "body": "Different histories. Different reasons. Life without alcohol can be the connection without becoming your whole identity.\nCTA: Share a Perspective\nSources: E23/E32; W03.", "category": "Social & editorial", "type": "Social post", "status": "Proposed copy", "section": "17"}, {"id": "social-7", "title": "04 — accountability with support", "body": "You own your story. You own the work. We want to help you find useful resources and people to walk with you.\nCTA: Meet ZeroBooze\nSource: E32.", "category": "Social & editorial", "type": "Social post", "status": "Proposed copy", "section": "17"}, {"id": "social-9", "title": "05 — founder practice", "body": "Every day. Every relationship. Every time.\nFor Keith, these words describe a standard he’s trying to live. What does personal accountability look like in your day?\nSources: E13/E16. Attribute the phrase to the conversation, not to a newly invented campaign.", "category": "Social & editorial", "type": "Social post", "status": "Proposed copy", "section": "17"}, {"id": "social-11", "title": "06 — progress", "body": "We’re building ZeroBooze deliberately, and we want to share the work as it develops. New reflections, useful resources, and honest updates on what’s still ahead.\nCTA: Receive Updates\nSources: E24/E32.", "category": "Social & editorial", "type": "Social post", "status": "Proposed copy", "section": "17"}, {"id": "social-13", "title": "EMAIL WELCOME", "body": "Subject: Welcome to ZeroBooze\nPreview: Your story belongs here.\n\n\nThanks for connecting with ZeroBooze.\n\n\nPeople come to life without alcohol for different reasons. Some have been here for years. Some are just beginning. Some are still asking questions.\n\n\nWe’re building a community with room for those differences. We’ll share useful resources, personal reflections, and updates as the larger vision takes shape.\n\n\nStart wherever feels right: read our story, explore resources, or send a note. You choose how much to share.\n\n\nZeroBooze\nSources: E09/E23/E24/E32. Link only to working destinations; include unsubscribe and the required sender details in the actual email system.", "category": "Social & editorial", "type": "Email", "status": "Proposed copy", "section": "17"}, {"id": "social-15", "title": "EDITORIAL STARTERS, source-grounded", "body": "What would have helped you at the beginning? [E17/E32]\nWhy a person should not have to explain everything to belong. [E19/E32]\nWhat “with you” means—and what it doesn’t promise. [E32]\nThe Quietly Concerned: opening a conversation without imposing a label. [E25/E32]\nGratitude and looking in the mirror: two practices Keith wants to coexist. [E13]\nA recipe, an everyday ritual, or an alcohol-free gathering worth sharing. [E32]\nA transparent update on residence development. [W03/E39]\nHow we evaluate a resource before recommending it. [E20/E32]\n\n\nTranscript-based video repurposing is developed in Section 21. Exact excerpts, phrase anchors, captions, and production notes are supplied. Capture actual clip timecodes from the master videos and obtain approval before editing or posting.", "category": "Social & editorial", "type": "Editorial idea", "status": "Proposed copy", "section": "17"}, {"id": "section-18", "title": "Sales, partnerships, and recruitment", "body": "PARTNER OVERVIEW — proposed\nZeroBooze is building a community around life without alcohol, grounded in personal ownership, useful support, and lived experience. We’re interested in collaborators whose work can add something meaningful for that community.\n\n\nWe’re developing the brand deliberately. The right relationship should fit the audience, add practical value, and be clear about what each partner is offering.\n\n\nSources: E22/E32.\n\n\nPARTNER SELECTION — proposed\nEvaluate audience fit, product or service quality, credibility, usefulness, relationship type, and disclosure needs. Keith is exploring both resale and affiliate models. Follower count is one input, not the proposition. [E32]\nPossible leads: sober activities/golf introduction in E08; beverage/nutrition relationships and cruise idea in E32; potential storytellers in E03. All are leads, not signed partnerships.\n\n\nRECRUITMENT INTRO — proposed future-opportunity copy\nHelp shape what comes next.\n\n\nZeroBooze is developing a broader vision for life without alcohol, including future residential recovery and support. We’re interested in people who combine expertise with empathy, value personal ownership, and are willing to question assumptions thoughtfully.\n\n\nAs roles are defined, we’ll share what they involve, the qualifications required, and how to apply.\n\n\nSources: E39; W03. No active vacancy or clinical appointment is implied.\n\n\nPROFESSIONAL / REFERRAL COPY — hold until services exist\nBuild a separate factual description of eligibility, service scope, provider credentials, location, program format, referral process, exclusions, and continued support. Do not use the lifestyle positioning as a substitute for those facts.\n\n\nINVESTOR CONTENT — separate workstream\nThe Oct. 12 exchange records Keith’s intention to provide deck inputs around the first week of November; it does not provide an investment thesis or verified projections. Keep investor requests distinct from consumer copy. [E34]\nInputs required: ownership structure, operating entity, site strategy, development status, capital need, financial model, team, clinical leadership, licensing path, evidence, risks, and milestones.\n\n\nNarrative seed — proposed:\nZeroBooze’s residential ambition grows from lived experience and a commitment to rethink how support is experienced. The investment case must be built from a defined operating model and evidence, with the community brand providing context rather than standing in for diligence.", "category": "Partnerships", "section": "18", "type": "Reference", "status": "Working reference"}, {"id": "section-19", "title": "Content operations and approval record", "body": "CONTENT RECORD — use for each new item\nContent ID / working title / audience / channel / objective / source IDs and original dates / original contributor / direct evidence or interpretation / offering status / draft / factual review / Keith approval / publication link / published date / next review date.\n\n\nRULES FOR ATTRIBUTION\nAttribute Keith’s words to Keith, Dustin’s proposals to Dustin, and new copy to this working draft. A forwarded message is not proof of agreement. Use the latest explicit direction when earlier advice conflicts; retain the older position in the decision history.\n\n\nFor new language inspired by a source, write “informed by,” not “Keith said.” For verbatim quotations, preserve wording and identify the original date. Link related assets to the email that supplied them.\n\n\nAPPROVAL PATH — recommended\nEditorial draft → source and language check → factual/operational review → Keith review → approved version → publish → record live URL.\nClinical claims need appropriate expert review and evidence before entering approved consumer copy. No automatic scheduling or posting is authorized by this document.\n\n\nSUCCESS MEASURES — proposed\nMeaningful replies and story/resource submissions; opted-in subscribers; repeat visits and resource use; qualified partner inquiries; useful feedback from priority audiences; successful resolution of contact/order questions. Track traffic and sentiment as Keith requested. Do not equate follower volume or merchandise sales with recovery outcomes. [E02/E22/E32]\n\n\nNEXT INPUTS THAT CHANGE THE COPY\nOperational status: what actually exists today?\nResidence scope, geography, status, and approved terminology.\nAny active professional or virtual service and its provider.\nConfirmed program design, duration, post-care, and payment terms.\nVerified store inventory, materials, price, shipping, and returns.\nWorking contact route, ownership, response expectation, and privacy notice.\nApproved founder history and personal acknowledgments.\nVerify clip timecodes and transcript wording against all four master recordings; supplied transcripts are now incorporated in Sections 21–23.\nApproval of “Our Residence,” “Along the Path,” public audience language, and Horizon placement.\nEvidence supporting any proposed outcome or comparison claims.", "category": "Workflow", "section": "19", "type": "Reference", "status": "Working reference"}, {"id": "section-20", "title": "Source register", "body": "Source IDs refer to the exact supplied email files. This register covers all 39 files; several contain repeated portions of earlier conversations. Repetition is not treated as independent corroboration. The received-date record reflects the email header; original conversation dates appear in the strategy and individual threads.\n\n\nE01 — (No Subject).eml\nEmail header date: Mon, 12 Oct 2026 15:42:55 +0000\nUse: Embroidery PMS colors\nSource: https://chatgpt.com/api/library/files/libfile_1d9b557f9e1c8191ac23bbbffb30f1b6/download\n\n\nE02 — Disruptor.eml\nEmail header date: Tue, 13 Oct 2026 00:47:25 +0000\nUse: Different versus better; customer experience\nSource: https://chatgpt.com/api/library/files/libfile_9ccadc6d59f481919409839fc370f54a/download\n\n\nE03 — FW_.eml\nEmail header date: Mon, 12 Oct 2026 15:41:06 +0000\nUse: Potential storyteller lead; identity unclear\nSource: https://chatgpt.com/api/library/files/libfile_c41823eb60bc81919b0a47959c6e2611/download\n\n\nE04 — FW_ 2.eml\nEmail header date: Mon, 12 Oct 2026 15:27:57 +0000\nUse: Brand connection / tattoo context\nSource: https://chatgpt.com/api/library/files/libfile_c303a2485f708191a171587c96357816/download\n\n\nE05 — FW_ 3.eml\nEmail header date: Mon, 12 Oct 2026 15:39:44 +0000\nUse: Demand and beds; research lead\nSource: https://chatgpt.com/api/library/files/libfile_8d18948b66b081919c80b8537ecc6db3/download\n\n\nE06 — FW_ Follow Up from DD_ ZeroBooze 24”W x 8”H Sign Concepts.eml\nEmail header date: Mon, 12 O
