/api/library/files/libfile_04cfba519570819195a2a42a360683ac/download\n\n\nE39 — ZB Anti Talking Points.eml\nEmail header date: Mon, 12 Oct 2026 10:14:51 +0000\nUse: KEY: Anti Talking Points PDF attachment\nSource: https://chatgpt.com/api/library/files/libfile_a2ae0198cce08191897e91e9d03e404e/download\n\n\nATTACHMENT A — ZeroBooze NOTES FROM KP SEPT 2026.docx\nContained in E32. Read in full. Keith’s responses to Dustin’s prompts supply the central direction for this draft. Distinguish the prompt wording from Keith’s answer.\n\n\nATTACHMENT B — ZB Anti Talking Points.pdf\nContained in E39. Text extracted in full. Provides preferred terminology, future video topics, and development milestones. Numerical claims and proposed clinical operations remain unverified.\n\n\nW01 — https://zerobooze.life/ — homepage, reviewed Oct. 13, 2026.\nW02 — https://zerobooze.life/story — founder-story view, reviewed Oct. 13, 2026.\nW03 — Keith’s Notebook dialog opened from W01 — reviewed Oct. 13, 2026.\nW04 — https://zerobooze.life/merch — store preview, reviewed Oct. 13, 2026.\n\n\nAUDIO RECEIVED — transcripts incorporated; playback verification pending\nA01 — 09.22.26 ZeroBooze Intro Video_v2.m4a\nA02 — 09.22.26_ZB Community_v1.m4a\nA03 — 09.22.26_Who is ZeroBooze For.m4a\nA04 — 09.22.26_A Pledge_v1.m4a\nAll four corresponding transcripts were supplied and read on October 13, 2026. See V01–V04 in Section 23 and the social production bank in Section 21. Spoken-content ideas are attributed to those transcripts. The underlying recordings have not been independently played back; exact timecodes and unclear wording remain for the video editor to verify.", "category": "Sources", "section": "20", "type": "Reference", "status": "Working reference"}, {"id": "section-21", "title": "Social media content library — transcript-based expansion", "body": "Added October 13, 2026. This section expands Section 17 into a reusable production bank. All posts are drafts for Keith’s review. Source labels V01–V04 refer to the supplied transcripts, not independently verified playback.\n\n\nV01 — ZeroBooze Intro Video (v2). Transcript lists runtime 1:43.\nV02 — Who is ZeroBooze For. Transcript lists runtime 1:37.\nV03 — ZB Community (v1). Transcript lists runtime 1:11.\nV04 — A Pledge (v1). Transcript lists runtime 1:19.\n\n\nNo transcript provides timestamps. Use the exact phrase anchors below to locate selections in the video. Target lengths are editorial suggestions, not measured clip durations. Confirm wording, audio quality, complete thought, and timecodes against the master footage before editing.\n\n\nThe V04 opening is expressly marked unclear in the supplied transcript. Do not quote or subtitle that opening until checked. Use “Quietly Concerned” consistently in drafted copy; Keith says “silently concerned” in these transcripts. Log this as a terminology variation for his confirmation.\n\n\nCONTENT TYPES\nFounder clips: Keith in his own words, with enough context to preserve meaning.\nQuote cards: exact excerpts, attributed to Keith and the source.\nPerspective posts: paraphrases clearly presented as draft brand copy.\nFactoids: verified brand facts or carefully sourced external information.\nCommunity stories: permission-based experiences, without inventing successes or turning an individual experience into an outcome claim.\nProgress posts: what is developing, what has changed, and what is still ahead.\n\n\nProduction fields for every item: content ID, source, phrase anchor, actual in/out timecodes, target platform, caption, CTA, transcript check, factual check, consent/approval, asset link, publish date, performance, reuse notes.", "category": "Social & editorial", "section": "21", "type": "Reference", "status": "Working reference"}, {"id": "C01", "title": "Simple and true", "body": "CLIP C01 — Simple and true\n\nSource: V01, final paragraph.\nLocate: “That's ZeroBooze. Simple and true.”\nSelection: include the preceding invitation about living without alcohol crossing someone’s mind or heart, then the closing line.\nTarget: 15–25 seconds, subject to actual footage.\nOn-screen hook — proposed: What is ZeroBooze?\nCaption — proposed: A community taking shape around life without alcohol. Different stories. A path that’s yours. ZeroBooze. Simple and true.\nCTA: Meet ZeroBooze.\nEditorial note: preserve “we hope to be” context where needed; do not turn an aspiration into a completed offering.", "category": "Social & editorial", "type": "Video clip", "status": "Needs footage check", "section": "21A"}, {"id": "C02", "title": "On your terms", "body": "CLIP C02 — On your terms\n\nSource: V01, third paragraph.\nExact transcript selection: “We're trying to build ZeroBooze so that we can assist others that want to be motivated to live a life without alcohol to do so on their terms, but with knowing that there is someone to walk that path with them.”\nTarget: 20–30 seconds.\nHook — proposed: Your terms. Your path.\nCaption — proposed: You own your story and your path. We’re building ZeroBooze with room for both—and with the hope that you’ll find someone to walk with you.\nCTA: Read Our Story.\nEditorial note: use accurate subtitles rather than replacing Keith’s spoken syntax with polished draft language.", "category": "Social & editorial", "type": "Video clip", "status": "Needs footage check", "section": "21A"}, {"id": "C03", "title": "A work in progress", "body": "CLIP C03 — A work in progress\n\nSource: V01, second paragraph.\nExact quote: “This is a new lifestyle brand that is a work in progress. The brand is to support a life without alcohol.”\nTarget: 10–20 seconds.\nHook — proposed: We’re building this together.\nCaption — proposed: ZeroBooze is taking shape. We want to share the work, hear what matters to you, and build something useful for life without alcohol.\nCTA: Follow Our Progress.\nEditorial note: “40-plus years in the making” is personal context, not the age of the business. If used, ask Keith what the phrase means and keep that distinction clear.", "category": "Social & editorial", "type": "Video clip", "status": "Needs footage check", "section": "21A"}, {"id": "C04", "title": "No labels", "body": "CLIP C04 — No labels\n\nSource: V02, final paragraph.\nExact quote: “We're not going to put labels on anybody. Labels are not fair. Everybody's unique.”\nTarget: 10–15 seconds.\nHook — proposed: You’re more than a label.\nCaption — proposed: People arrive here with different histories and different reasons. You get to decide what your story means.\nCTA: Meet the Community.\nEditorial note: use a working community destination; otherwise use About.", "category": "Social & editorial", "type": "Video clip", "status": "Needs footage check", "section": "21A"}, {"id": "C05", "title": "Room for different reasons", "body": "CLIP C05 — Room for different reasons\n\nSource: V02, middle paragraph.\nLocate: “the sober curious” through “they have an important place in the community.”\nTarget: 20–30 seconds.\nHook — proposed: There’s room for your reason.\nCaption — proposed: Some people come to life without alcohol through recovery. Others are curious about how it might fit their lives. The reasons can be different. The invitation can still be shared.\nCTA: Explore Resources.\nEditorial note: Keith’s “fairly large segment” and “primarily younger adults” are his perspective. Avoid using those descriptions as statistical factoids without independent evidence. A concise selection can focus on the invitation.", "category": "Social & editorial", "type": "Video clip", "status": "Needs footage check", "section": "21A"}, {"id": "C06", "title": "Content for different stages", "body": "CLIP C06 — Content for different stages\n\nSource: V02, first paragraph.\nExact opening: “I think we need to make sure that there's content for the recovered and content for the recovering.”\nTarget: 15–25 seconds with surrounding context.\nHook — proposed: Different stages. Different needs.\nCaption — proposed: What is useful at the beginning may differ from what matters years later. We want ZeroBooze to make room for those differences.\nCTA: Tell Us What Would Help.\nEditorial note: do not make viewers choose a public label or disclose their recovery stage.", "category": "Social & editorial", "type": "Video clip", "status": "Needs footage check", "section": "21A"}, {"id": "C07", "title": "You’re not alone", "body": "CLIP C07 — You’re not alone\n\nSource: V03, first paragraph.\nExact quote: “For successful lives without alcohol, you need to know that you're not alone on this path.”\nTarget: 10–20 seconds with context.\nHook — proposed: Someone to walk with you.\nCaption — proposed: Connection matters to Keith. It’s one of the reasons he’s building ZeroBooze around community.\nCTA: Start a Conversation.\nEditorial note: attribute this to Keith’s belief; do not frame it as a guaranteed or proven outcome of joining ZeroBooze.", "category": "Social & editorial", "type": "Video clip", "status": "Needs footage check", "section": "21A"}, {"id": "C08", "title": "“That’s me”", "body": "CLIP C08 — “That’s me”\n\nSource: V03, second paragraph.\nExact quote: “Hopefully the platform encourages people to share their stories so that others can say, ‘Ah, that's me. I've experienced that before.’”\nTarget: 15–20 seconds.\nHook — proposed: Recognition can start a conversation.\nCaption — proposed: Sometimes another person’s story helps you recognize something in your own. Share only what you choose. We’ll ask before publishing it.\nCTA: Share a Perspective.\nEditorial note: the platform is an intention; verify how submissions are handled.", "category": "Social & editorial", "type": "Video clip", "status": "Needs footage check", "section": "21A"}, {"id": "C09", "title": "A common thread", "body": "CLIP C09 — A common thread\n\nSource: V03, first paragraph.\nExact quote: “We all have a common thread, but we certainly have many different, personal, deep stories.”\nTarget: 10–15 seconds.\nHook — proposed: Different stories. A shared thread.\nCaption — proposed: Life without alcohol can connect us without making our lives identical. There’s room for the parts of your story that are yours alone.\nCTA: Read Our Story.\nEditorial note: “joint ownership” elsewhere in this paragraph means participation in shaping the brand. Do not imply legal equity or ownership rights.", "category": "Social & editorial", "type": "Video clip", "status": "Needs footage check", "section": "21A"}, {"id": "C10", "title": "A moving horizon", "body": "CLIP C10 — A moving horizon\n\nSource: V03, third paragraph.\nLocate: “even though it's a game that doesn't have a final second on the clock. There's a horizon that continues to move away from you.”\nTarget: 15–25 seconds including enough lead-in to make the metaphor understandable.\nHook — proposed: The horizon keeps moving.\nCaption — proposed: For Keith, life without alcohol is something he continues to practice. Personal ownership and community remain part of that path.\nCTA: Read Along the Path.\nEditorial note: do not isolate “in it to win it” as a promise of success. Exclude the earlier generalized claim that family pressure diminishes the likelihood of success unless properly reviewed and supported.", "category": "Social & editorial", "type": "Video clip", "status": "Needs footage check", "section": "21A"}, {"id": "C11", "title": "Why he’s building it", "body": "CLIP C11 — Why he’s building it\n\nSource: V04, second paragraph.\nExact quote: “I am not in this to make money. I'm in this to help people find and embrace a life without alcohol.”\nTarget: 10–20 seconds.\nHook — proposed: The reason behind ZeroBooze.\nCaption — proposed: Keith’s motivation is personal: helping people find and embrace life without alcohol. That belief is guiding what we build next.\nCTA: Meet Keith.\nEditorial note: this states his motivation. It does not establish nonprofit status, free services, or where store revenue goes.", "category": "Social & editorial", "type": "Video clip", "status": "Needs footage check", "section": "21A"}, {"id": "C12", "title": "Experience with purpose", "body": "CLIP C12 — Experience with purpose\n\nSource: V04, second paragraph.\nLocate: “That doesn't mean I can't bring my business experiences to bear upon the product that is delivered” through one or more examples.\nTarget: 20–35 seconds.\nHook — proposed: Bringing a builder’s experience to a personal mission.\nCaption — proposed: Keith wants to bring his experience building businesses to ZeroBooze—while keeping the person and the community at the center.\nCTA: Explore Our Horizon.\nEditorial note: keep “intend to build” and “part of our plan” when describing centers or a foundation. Never splice plans into a statement of current availability.", "category": "Social & editorial", "type": "Video clip", "status": "Needs footage check", "section": "21A"}, {"id": "C13", "title": "Give back", "body": "CLIP C13 — Give back\n\nSource: V04, closing paragraph.\nExact quote: “I intend to, hopefully, give back more than I've ever gotten out of my sobriety.”\nTarget: 10–20 seconds.\nHook — proposed: What giving back means to Keith.\nCaption — proposed: ZeroBooze began with Keith’s own experience. He wants what comes next to be useful to others, too.\nCTA: Read Our Story.\nEditorial note: preserve the aspiration. Do not rewrite as a verified charitable impact claim.", "category": "Social & editorial", "type": "Video clip", "status": "Needs footage check", "section": "21A"}, {"id": "C14", "title": "A personal moment of ownership", "body": "CLIP C14 — A personal moment of ownership\n\nSource: V04, first paragraph, after the unclear opening.\nLocate: “I might have told everybody I didn't have a problem with alcohol, but I knew that I did” through “now is the time.”\nTarget: 20–35 seconds.\nHook — proposed: A decision that belonged to him.\nCaption — proposed: Keith reflects on recognizing what he already knew and choosing to take ownership. Your story may look different. You can start with a question.\nCTA: Explore Resources.\nEditorial note: use the story as Keith’s own experience; avoid implying denial or dishonesty describes every viewer. Verify the opening and cut points against the recording.", "category": "Social & editorial", "type": "Video clip", "status": "Needs footage check", "section": "21A"}, {"id": "Q01", "title": "We're not going to put labels on anybody.", "body": "“We're not going to put labels on anybody.”\n— Keith Polaski, V02\nCaption — proposed: You don’t have to fit a category to find something useful here.", "category": "Social & editorial", "type": "Quote card", "status": "Transcript excerpt", "section": "21B"}, {"id": "Q02", "title": "Everybody's unique.", "body": "“Everybody's unique.”\n— Keith Polaski, V02\nCaption — proposed: Different reasons. Different histories. A story that belongs to you.", "category": "Social & editorial", "type": "Quote card", "status": "Transcript excerpt", "section": "21B"}, {"id": "Q03", "title": "We all have a common thread, but we certainly have many different, personal, deep stories.", "body": "“We all have a common thread, but we certainly have many different, personal, deep stories.”\n— Keith Polaski, V03\nCaption — proposed: The connection doesn’t erase the differences.", "category": "Social & editorial", "type": "Quote card", "status": "Transcript excerpt", "section": "21B"}, {"id": "Q04", "title": "The community, and support of the community, is just terribly important to me.", "body": "“The community, and support of the community, is just terribly important to me.”\n— Keith Polaski, V03\nCaption — proposed: Community is part of the foundation Keith is building.", "category": "Social & editorial", "type": "Quote card", "status": "Transcript excerpt", "section": "21B"}, {"id": "Q05", "title": "There's a horizon that continues to move away from you.", "body": "“There's a horizon that continues to move away from you.”\n— Keith Polaski, V03\nCaption — proposed: Keith’s reminder that the path continues. Share the complete clip alongside this card when possible.", "category": "Social & editorial", "type": "Quote card", "status": "Transcript excerpt", "section": "21B"}, {"id": "Q06", "title": "That's ZeroBooze. Simple and true.", "body": "“That's ZeroBooze. Simple and true.”\n— Keith Polaski, V01\nCaption — proposed: A personal beginning. A shared ambition for life without alcohol.", "category": "Social & editorial", "type": "Quote card", "status": "Transcript excerpt", "section": "21B"}, {"id": "Q07", "title": "I'm in this to help people find and embrace a life without alcohol.", "body": "“I'm in this to help people find and embrace a life without alcohol.”\n— Keith Polaski, V04\nCaption — proposed: The purpose Keith keeps coming back to.", "category": "Social & editorial", "type": "Quote card", "status": "Transcript excerpt", "section": "21B"}, {"id": "Q08", "title": "It's easy because it's the truth.", "body": "“It's easy because it's the truth.”\n— Keith Polaski, V04\nCaption — proposed: Keith on speaking honestly about why he’s building ZeroBooze. This refers to telling the truth, not to recovery being easy.", "category": "Social & editorial", "type": "Quote card", "status": "Transcript excerpt", "section": "21B"}, {"id": "reflections", "title": "Brand reflections", "body": "BRAND REFLECTIONS — new copy, not Keith quotations\nYour story doesn’t have to look like someone else’s to belong here. [V02/V03]\nYou can ask a question before you have an answer. [E32/V04]\nA shared thread. Room for your whole story. [V03]\nYour terms. Your path. Someone to walk with you. [V01]\nWhat helped you might be useful to someone else. [E32/V03]\nConnection can begin with a simple hello. [W01/E32]\n\n\nUse these as brand statements or prompts. Do not put them in quotation marks with Keith’s name.", "category": "Social & editorial", "type": "Reflection", "status": "Proposed copy", "section": "21B"}, {"id": "F01", "title": "safe brand fact", "body": "ZeroBooze began in the early days of Keith’s sobriety.\nSource: E23 and approved founder-history review.\nCaption — proposed: A personal experience started the brand. Your experience can help shape what comes next.\nDo not infer an exact founding date or sobriety date from this.", "category": "Social & editorial", "type": "Factoid", "status": "Review required", "section": "21C"}, {"id": "F02", "title": "founder background", "body": "Keith co-founded radius financial group in 1999.\nSource: P01, radius advisory-board site; confirm preferred current role.\nUse sparingly in founder content; experience in business is not a clinical credential.", "category": "Social & editorial", "type": "Factoid", "status": "Review required", "section": "21C"}, {"id": "F03", "title": "developing vision", "body": "Keith’s plan includes community, future recovery/relief centers, events, and a charitable foundation.\nSources: V04/E20/E39.\nCaption — proposed: There’s more to the vision. We’ll share each part as it develops.\nAlways retain the future status.", "category": "Social & editorial", "type": "Factoid", "status": "Review required", "section": "21C"}, {"id": "F04", "title": "participation principle", "body": "Keith wants content for different experiences without labeling individuals.\nSource: V02.\nCarousel — proposed: Different stages / Different reasons / Useful perspectives / Your story remains yours.", "category": "Social & editorial", "type": "Factoid", "status": "Review required", "section": "21C"}, {"id": "story-template", "title": "A Path of My Own — story toolkit", "body": "SUCCESS-STORY STATUS\nNo independently documented, consented ZeroBooze participant success story is supplied. Keith’s story is a founder perspective, not evidence of a ZeroBooze program result. The emails suggest possible storytellers and a tattoo-related community connection; identities, permissions, and details remain to be confirmed. [E03/E04/E08]\n\n\nSTORY SERIES — proposed label: “A Path of My Own”\nInterview prompts:\nWhat was happening in your life when alcohol-free living became important to you?\nWhat helped you choose a next step?\nWhat was one ordinary change that mattered?\nWho or what supported you?\nWhat is still difficult?\nWhat would you tell someone who is quietly asking questions?\nWhat do you want kept private?\nHow do you want your name, photograph, or voice used?\n\n\nSTORY TEMPLATE\nWorking title: [In the participant’s own words]\nName or chosen attribution: [Blank]\nExperience and date: [Blank]\nBefore / turning point / what helped / life now / continuing challenges: [Blank]\nExact approved quote: [Blank]\nRelationship to ZeroBooze: [Blank; do not imply care was received]\nSource interview and timecodes: [Blank]\nConsent for words / image / video / channels / reuse: [Blank]\nFactual review and approval: [Blank]\nCaption and CTA: [Draft only after interview]\n\n\nUse stories with nuance. Do not invent a tidy ending, suppress continuing difficulty, or generalize a personal result into a promise for others. Publication requires the person’s permission, not just a submitted message.", "category": "Social & editorial", "type": "Story template", "status": "Review required", "section": "21C"}, {"id": "calendar", "title": "Four-week starter calendar", "body": "FOUR-WEEK STARTER CALENDAR — proposed\nWeek 1: C02 “On your terms”; Q01 no labels; prompt “What would have helped you at the beginning?”\nWeek 2: C08 “That’s me”; Q03 shared thread; resource spotlight with verified original link.\nWeek 3: C11 founder purpose; F02 founder background; an actual development update.\nWeek 4: C05 different reasons; Q04 community; a consented community story if ready, otherwise an invitation to contribute.\n\n\nThree items per week is a proposed starting rhythm, not a posting commitment. Adapt rather than repeating the exact same post on every channel. Review response quality and what people find useful. No posts or schedules are published by this document update.", "category": "Social & editorial", "type": "Calendar", "status": "Proposed copy", "section": "21C"}, {"id": "research", "title": "Statistics research queue", "body": "STATISTICS RESEARCH QUEUE — do not publish yet\nMarket figures and competitor claims from E17; duration-history claims from E25/E29; comparative outcomes from E39. Each needs a reliable source, definition, date, and review. The supplied transcripts do not verify these claims. Do not manufacture statistics just to fill a factoid slot.", "category": "Social & editorial", "type": "Research", "status": "Review required", "section": "21C"}, {"id": "bio-1", "title": "Bio purpose", "body": "Begin a factual bio record for About, press, partnerships, speaking, and eventual investor materials. Keep the website story personal; use the professional bio where context and credibility are needed. The older emails questioned a standard resume-style bio. This new section follows Dave’s request while preserving that distinction. [E29/E30]", "category": "Keith’s bio", "type": "Bio", "status": "Needs Keith review", "section": "22"}, {"id": "bio-3", "title": "Verified foundation", "body": "Founder of ZeroBooze: established by emails, current website, and supplied transcripts. [E23/E32/W02/V01–V04]\nCo-founder of radius financial group: identified by the organization’s advisory-board site, which dates the company’s founding to 1999. [P01]\nMilitary background: identified by the same official site. Branch, rank, dates, and assignments are not supplied. [P01]\nBusiness-building experience: reflected in the emails, existing founder story, and V04. No clinical credentials are established by these sources.\nPersonal purpose: Keith says he wants to help people find and embrace life without alcohol. [V04]\nRecovery status and timing: personal details require Keith’s current review; historical wording should not be treated as a live sobriety counter.", "category": "Keith’s bio", "type": "Reference", "status": "Needs Keith review", "section": "22"}, {"id": "bio-5", "title": "Short bio", "body": "Keith Polaski is the founder of ZeroBooze, a developing lifestyle brand and community around life without alcohol. Drawing on his own experience with sobriety and years of building businesses, he wants to create useful ways for people to connect, find support, and follow a path that belongs to them. He also co-founded radius financial group in 1999.\nSources: E23/E32/W02/V01/V04; career sentence P01.\nReview: confirm current titles and comfort with personal wording. Brand spelling is confirmed: ZeroBooze.", "category": "Keith’s bio", "type": "Bio", "status": "Needs Keith review", "section": "22"}, {"id": "bio-7", "title": "Extended bio", "body": "Keith Polaski founded ZeroBooze in the early days of his own sobriety. After years spent building businesses, he began working on something more personal: a brand and community shaped around life without alcohol.\n\n\nZeroBooze grows from a belief that people own their story and their path. Keith wants it to offer connection, useful perspectives, and room for experiences that differ from his own. He is particularly focused on people in recovery and people who are privately beginning to question the role alcohol plays in their lives.\n\n\nKeith co-founded radius financial group in 1999. Its advisory-board site also identifies his military background.\n\n\nAt ZeroBooze, he hopes to apply his experience as a builder to a broader vision that includes community, future recovery and relief centers, and other ways to support alcohol-free living. Those plans are still developing. His intention is to help people find and embrace life without alcohol on their own terms.\nSources: E23/E32/V01/V02/V04; professional facts P01.\nThis is a proposed biography, not a claim of clinical expertise, an operational care network, or registered charitable status.", "category": "Keith’s bio", "type": "Bio", "status": "Needs Keith review", "section": "22"}, {"id": "bio-9", "title": "First-person intro", "body": "I’ve spent years building businesses. ZeroBooze is the most personal thing I’ve tried to build.\n\n\nIt started in my own sobriety, with a need to find something useful and a reason to keep building. I want it to become a community where people can connect, explore life without alcohol, and follow a path that belongs to them.\n\n\nMy experience is where this began. Your story can help shape what comes next.\nSources: W02/E32/V01/V03/V04. This is new draft language, not a transcript quotation.", "category": "Keith’s bio", "type": "Bio", "status": "Needs Keith review", "section": "22"}, {"id": "bio-11", "title": "Questions for keith — fill-in record", "body": "Preferred name and current titles: [________________]\nHow should we describe your present relationship to radius? [________________]\nWhat year did your mortgage / business career begin? [________________]\nWhich roles and companies should appear in a professional bio? [________________]\nMilitary branch, years of service, rank, and relevant experience you want public: [________________]\nEducation, qualifications, and professional associations worth including: [________________]\nWhich awards or business milestones matter—and where can we verify them? [________________]\nWhen did ZeroBooze become an idea, and when was the company formally established? [________________]\nWhat does “40-plus years in the making” mean to you? [________________]\nDo you want a sobriety date or specific recovery timeline published? If so, what wording? [________________]\nWhich personal details, names, or earlier experiences should remain private? [________________]\nWhat would you like to say about family, faith, or the people who supported you? [________________]\nWhich charitable or community activities predate ZeroBooze? [________________]\nWhat are you proud of professionally that helps explain your approach here? [________________]\nWhat do you want readers to understand about your role versus future clinical professionals? [________________]\nWhat is your primary focus at ZeroBooze right now? [________________]\nHow should we describe your current geographic base without exposing a private address? [________________]\nWhat do you want the bio to sound like when you read it aloud? [________________]\nApproved portrait, photo credit, press contact, and version date: [________________]\n\n\nDo not republish the private agreement address, assume a current executive role from an old page, or infer military details or degrees. Invite Keith to correct the record before any public use.", "category": "Keith’s bio", "type": "Questionnaire", "status": "Needs Keith review", "section": "22"}, {"id": "section-23", "title": "Transcript implications and new source register", "body": "WHAT THE TRANSCRIPTS ADD\nOwnership is a direct founder theme, not only an interpretation of emails. [V01/V03/V04]\nThe community should encourage recognition through different stories. [V03]\nInternal audience segmentation should not become labels imposed on visitors. [V02]\nGiving back and helping people are explicit motivations. They do not establish nonprofit status or free offerings. [V04]\nBusiness experience is relevant to building the experience, while future centers and a foundation remain plans. [V04]\n“40-plus years in the making” needs personal clarification rather than being used as a corporate age claim. [V01]\nThe words “silently concerned” in the transcripts differ from “Quietly Concerned” in the September notes. Maintain the latter as the working written label until Keith confirms; keep quotes faithful. [V02/V04 vs. E32]\n\n\nHOW THIS AFFECTS EXISTING COPY\nSections 3 and 10: keep audience categories in internal planning; explain the public invitation in ordinary language rather than requiring self-classification.\nHome: “on your terms” and “someone to walk with you” now have direct transcript support. [V01]\nAbout and bio: keep founder experience as context, then return to the visitor. [V01/V03]\nCommunity: use shared stories to create recognition; do not promise recovery outcomes from participation. [V03]\nHorizon: continue labeling centers, events, sponsorship, and the foundation as development plans. [V04]\nStore: personal purpose does not imply purchases fund a charity. [V04]\n\n\nTRANSCRIPT SOURCES — supplied and read in full\nV01 — ZeroBooze_Intro_Video_v2.txt\nSource: https://chatgpt.com/api/library/files/libfile_0e52a8968a948191be84748fa56109b2/download\nAsset label: Intro Video v2. Runtime listed in transcript: 1:43. No timecodes.\n\n\nV02 — Who_is_ZeroBooze_For.txt\nSource: https://chatgpt.com/api/library/files/libfile_e63c36e45efc819186ba6fea0a2fd3ba/download\nAsset label: Who is ZeroBooze For. Runtime listed: 1:37. No timecodes.\n\n\nV03 — ZB_Community_v1.txt\nSource: https://chatgpt.com/api/library/files/libfile_7c2405e0c6a08191a8be60f31c5ea6fe/download\nAsset label: ZB Community v1. Runtime listed: 1:11. No timecodes.\n\n\nV04 — A_Pledge_v1.txt\nSource: https://chatgpt.com/api/library/files/libfile_b39109f27a5481918376c98a1681ebd9/download\nAsset label: A Pledge v1. Runtime listed: 1:19. Opening marked unclear. No timecodes.\n\n\nPUBLIC BIO SOURCES\nP01 — radius financial group advisory-board site\nhttps://www.radiusadvisoryboard.com/\nReviewed October 13, 2026. Establishes Keith’s co-founder identity, military background, and the company’s 1999 founding. Includes older strategy material; current titles and figures require confirmation. Avoid reusing undated employee counts as current.\n\n\nP02 — The Boston Globe, Paul E. Kandarian, February 12, 2016\nhttps://www.bostonglobe.com/metro/regionals/south/2016/02/12/norwell-based-mortgage-lender-among-fastest-growing-massachusetts/GwxpVWDEUjneVkpHybwKlI/story.html\nHistorical press context: a 2016 profile interviewed Keith about radius’s growth. Not used for current company statistics or clinical credentials.\n\n\nP03 — LinkedIn, supplied link\nhttps://www.linkedin.com/in/keith-polaski-3564b1/?isSelfProfile=false\nProfile content was not retrievable in this review. No titles, dates, education, or credentials are drawn from it. Keith can provide profile text or answer the bio questions.\n\n\nTRANSCRIPTION / EDITING STATUS\nThe transcript content is now incorporated. The recordings themselves have not been independently played back or frame-reviewed. Validate exact clips, subtitles, cut points, and all timecodes against the master videos before production. The transcript runtime for V01 differs from the 1:10 Dropbox preview previously observed; confirm which video version the editor is using.", "category": "Sources", "section": "23", "type": "Reference", "status": "Working reference"}, {"id": "IQ01", "title": "End game — an enjoyable life without alcohol", "body": "END GAME THEME\n\n“There is an enjoyable life to be lived…. in a life lived without alcohol”.\n\nSource: supplied by Dave, October 14, 2026.\nAttribution: not supplied.\nUse: inspirational quote / end game theme for review. Original wording preserved.", "category": "Inspirational Quotes", "type": "Inspirational quote", "status": "Proposed copy", "section": "24"}], "documentUrl": "https://docs.google.com/document/d/1xvFMI1h2zrdT1y0c5AbaEqqtn1Neq6299v_6DshyNNw/edit?usp=drivesdk", "sourceText": "ZeroBooze — Content Hub & Website Copy\nWorking foundation • October 13, 2026\nPrepared for Dave Belyea / Jackrabbit Design\nStatus: source-grounded strategy and proposed copy for review. Public copy is not approved or published.\n\n\n1. How to use this hub\nThis is the central working record for ZeroBooze’s brand, website, social, marketing, partnerships, sales, recruitment, and community communications. It starts from the client’s intent, rather than assuming the current site or earlier drafts are the answer.\n\n\nEvidence labels:\nCONFIRMED DIRECTION: an explicit statement by Keith in an email or his September notes.\nCOLLABORATOR PROPOSAL: a recommendation from Dustin or another contributor, without assuming Keith approved it.\nINTERPRETATION: our reading of the pattern across sources.\nPROPOSED COPY: new language written for review.\nFUTURE / UNVERIFIED: a plan or claim that cannot yet be presented as an available service or established result.\n\n\nEach strategic point and copy module includes source IDs. The source register at the end identifies the email files and links back to them. Dates cited in the discussion are the original conversation dates, rather than simply the October forwarding dates.\n\n\nCoverage: the message text and forwarded conversations in 39 individual email files; Keith’s September 2026 DOCX attachment; the Anti Talking Points PDF attachment; the current website’s homepage, founder story, notebook, and store preview; and all four supplied video transcripts. Sections 21–23 add transcript-based social content and Keith’s bio. Design files, photographs, legal agreements, and other embedded attachments have not all been visually reviewed. Transcript wording is source material; actual recordings, clip timecodes, and picture edits still require verification.\n\n\nLater additions should record source, owner, date, audience, channel, availability status, copy status, and approval. Preserve earlier decisions in the decision log when direction changes.\n\n\n2. What Keith is trying to build\nCONFIRMED DIRECTION\nZeroBooze is bigger than merchandise. Keith wants empathy and support, acknowledgment of the individual in each story, and navigation toward life without alcohol. He describes the ambition as the “Waze” of sobriety. Community and in-residence development should move in parallel, on different timelines. [E32 attachment, Sept. 12]\n\n\nHis priority audiences are the Recovering and the Quietly Concerned. People own their story and their path. Accountability matters, but the tone should carry it subtly and deliberately. His central distinction: ZB cannot do the work FOR someone, but can do it WITH them. [E32]\n\n\nHe wants community participation, shared stories, eventual gatherings, useful resources, and invitations to help shape the brand. Merchandise remains available for those who want it; it is ancillary. [E09, July 7; E32]\n\n\nHe wants the brand to feel premium, conversational, and clear without being in someone’s face. Softness does not come naturally to him; he explicitly asks for help balancing his directness. He wants the founder story early, while preserving the feeling that this is about the visitor. [E32]\n\n\nINTERPRETATION\nKeith is a builder who wants lived experience to lead to useful change. His frustration with familiar recovery conventions fuels ambition, but his strongest public message is practical companionship and personal ownership. “Disruption” should be demonstrated by concrete choices and evidence as they develop.\n\n\nThe brand needs two speeds: a clear, useful community experience people can enter now, and a longer-term vision with transparent milestones. A visitor should not have to decipher which is which. [E20, E25, E29–E30, E32; W01–W03]\n\n\nWORKING POSITIONING — proposed\nZeroBooze is a community taking shape around life without alcohol, built from lived experience and grounded in the belief that you own your story and your path. It brings people, perspectives, and useful resources together, while working toward a broader future in recovery and support. [E09, E23, E32]\n\n\nSHORT DESCRIPTION — proposed\nLife without alcohol. Your story. Your path. A community to walk with you.\n\n\nUse that as descriptive copy, not an assumed approved tagline. Keith agreed that the name can stand alone. [E25, Aug. 28]\n\n\n3. Audience priorities\nThe Recovering — primary\nKeith defines this audience as day one through five years in his internal notes. Their need: continued support, useful next steps, and a connection beyond a single episode of care. Message: you are doing the work; you do not have to navigate every part alone. Avoid making the five-year boundary a public clinical definition. [E32]\n\n\nThe Quietly Concerned — primary\nPeople at the doorstep of change who have not taken that step. Their need: recognition, privacy, and a manageable invitation. Message: you can start with a question. Do not assume they identify with recovery or publicly disclose concerns. [E25, E23, E32]\n\n\nThe Recovered — secondary\nKeith’s internal definition is five-plus years. Their need: identity, connection, contribution, and respect for experience. Message: your perspective can help someone find their next step. Avoid suggesting they have crossed a universal finish line. [E32]\n\n\nThe Sober Curious — secondary\nPeople considering alcohol-free living, including for health or lifestyle reasons, without assuming an abuse history. Message: there is room for your reason. [E23, E32]\n\n\nAdditional communication audiences — proposed\nLoved ones seeking a way to support someone; professionals and referral partners assessing credibility; potential employees and collaborators; partners and donors; investors considering the future residential vision. These require different proof and calls to action. Do not make investor ambition the homepage’s primary message.\n\n\nDecision history\nDustin’s July 7 recommendation emphasized people already living without alcohol and deferred sober curious outreach. Keith’s September notes broadened the model and explicitly prioritized the Recovering and Quietly Concerned. The September notes guide this draft. [E09 → E25/E23 → E32]\n\n\n4. Voice, tone, and message pillars\nVOICE — proposed application of Keith’s direction\nConversational, direct, warm, and sure of itself. Use short clear sentences alongside natural paragraphs. Address a person rather than a demographic category. Make room for uncertainty without sounding vague. Offer participation without demanding disclosure. Use empathy with accountability; do not moralize or promise to save anyone. [E10, E18–E19, E23–E25, E32; W02]\n\n\nPILLAR A: Your story belongs to you\nYou own your story and your path. Different histories can share a common connection without being flattened into the founder’s experience. [E23, E32; W03]\nUse in: homepage, About, invitations to share, community guidelines.\n\n\nPILLAR B: We can walk with you\nSupport and useful navigation accompany personal effort. Make the next step feel approachable and specific. [E32]\nUse in: Resources, Contact, support descriptions, after-care communications when a service exists.\n\n\nPILLAR C: Belonging comes first\nCommunity is a priority, not a by-product of shopping. Merchandise expresses connection; purchasing is not a condition of participation. [E09, E22, E32]\nUse in: homepage order, Store, email welcome, social.\n\n\nPILLAR D: Build deliberately; show the work\nThe brand is in development. Updates, questions, and milestones can make progress visible and invite collaboration. [E24, E32; W03]\nUse in: Horizon, notebook, recruitment, investor materials.\n\n\nPILLAR E: Question conventions with care\nChallenge assumptions about the experience of recovery, with specific reasons and substantiation. Lead with what improves life for the individual. [E02, E25, E29]\nUse in: thought leadership and program development; avoid unsupported comparisons in public sales copy.\n\n\nRecognition, permission, and relief are a useful editorial test proposed by Dustin, not a documented final emotional choice by Keith. Pair that test with Keith’s explicit “empathy and support.” [E19 vs. E32]\n\n\nBEFORE / AFTER — editorial examples\nGeneric: “Embark on an inspiring journey.”\nProposed: “Find a next step that makes sense for you.”\nGeneric: “We will transform your life.”\nProposed: “You own the work. We want to help you find the people and resources to support it.”\nGeneric: “Our facility treats patients.”\nProposed future description: “Our planned residence will be shaped around the people who come here for recovery.”\n\n\n5. Keith’s language guide\nSource: E39, ZB Anti Talking Points PDF. These are Keith’s preferred contrasts, recorded faithfully. They are an internal direction list, not evidence that planned clinical offerings or outcomes exist.\n\n\nAvoid → Keith’s preferred wording\nTreatment → Relief / Recovery\nJourney → Path\nOne Day at a Time → Your own Horizon\n“AA” Foundation → Ownership Foundation\nTraditional / Accepted Treatment → Disruption Treatment\nPatient → Resident\nAlcoholism → Abuse\nInspire → Self-Realization\n30 Days & 60 Days → 45 Days & 75 Days\nAcceptance → Admission\n12% Outcome → 35% Outcome (3X)\nSelf-Serve Post Care → Administered Post Care\nStatic / Accepted Modalities → Disruption Modalities\nGroups → Community\nInsurance Pay → High Self-Pay\nProfit Focused → Success Focused\nVarying Residential Rules → Regimented Residential Rules\n\n\nAdditional explicit preferences\nFacility: avoid in public brand language; Dave’s current brief confirms this preference. Proposed replacement: “Our Residence,” subject to confirming there is a single residential property. “Our Spaces” works if the page covers several locations or nonresidential settings.\nQuietly Committed: superseded by Quietly Concerned. [E25, E23, E32]\n“Live inside”: Keith questioned it; use experience, commonality, expression, or support instead. [E23]\nRoad: Keith explicitly asks to replace it with path. [E32]\n“Inspire / Journey / Celebrate” as a logo lockup: challenged by Dustin, followed by Keith’s pivot toward the name alone. [E15, E25]\n“Celebrating Sobriety, Inspiring Recovery”: considered, then set aside; not the default tagline. [E21, E25]\n\n\nHOW TO APPLY\nPrefer recovery, relief, support, path, ownership, community, and life without alcohol. “Resident” belongs in an actual residential context; use person, community member, or participant elsewhere. Avoid defining someone as “an abuser.” Even though “Abuse” appears on Keith’s list, person-centered plain language often removes the need for a label.\n\n\nThe list is not a mechanical word-replacement tool. “Admission” can mean entering a program; do not replace emotional acceptance everywhere. “Disruption Treatment” still uses a word Keith otherwise dislikes, so retain that exact contrast in the internal register while writing public copy around the specific approach.\n\n\nDo not convert 45/75-day plans, self-pay positioning, administered post care, residential rules, or numerical outcomes into current service facts. All require operational confirmation. The 12% / 35% / 3X line is an unverified claim and is excluded from public copy.\n\n\nRespect different approaches to recovery. Ownership is the brand’s organizing idea; it does not establish that the brand rejects all spiritual or peer-support options. The PDF’s appendix describes several alternatives with differing philosophies, including 12-step approaches. Do not copy that appendix as verified current resource guidance without checking the original providers.\n\n\n6. Decisions, tensions, and evidence boundaries\nDECISIONS TO CARRY FORWARD\nCommunity is a priority. [Keith, E09, July 7]\nLet ZeroBooze stand on its own; the tagline discussion has changed. [Keith, E25, Aug. 28; E21 forwarding note]\nUse Quietly Concerned and prioritize that audience alongside the Recovering. [Keith, E23/E32, Sept. 4/12]\nKeep merchandise secondary. [Keith, E32]\nUse conversational copy with deliberate accountability. [Keith, E32]\nDevelop community and residential ambitions in parallel on different timelines. [Keith, E32]\nUse opt-in updates and communications. [Keith, E32]\nAllow both Gratitude and Interview in Progress to coexist as personal practices. [Keith, E13, Sept. 19]\nPreserve a Horizon space for future ambitions. [Keith, E20, Sept. 7]\n\n\nTENSIONS TO RESOLVE THROUGH DESIGN AND COPY\nQuiet public voice versus “let’s break things” internal energy: keep the public welcome calm; demonstrate challenge through substantive content. [E25/E32]\nFounder authenticity versus a community larger than one person: use Keith’s story to open the door, then turn toward the visitor and other voices. [E22/E32]\nLifestyle brand versus residential provider: one brand can connect them, but available services and future plans must be unmistakable. Dustin suggested separate sites; Keith later emphasized parallel efforts. Architecture remains a decision, not a settled mandate. [E30/E32]\nPrivacy versus direct access: Keith wants a brand-facing conversation channel, not his personal number prominently displayed. Verify workflow and response expectations before activating it. [E32; W01]\nPremium versus accessible: dignity and clarity should create the premium feeling without implying everyone must shop or afford residential care.\n\n\nCLAIMS HELD FROM PUBLIC COPY\nClaims about the historical origin of 28-day programs: present in E25/E29, not independently substantiated here.\nNumerical recovery outcomes and “3X”: present in E39, no definition, denominator, follow-up period, or supporting evidence supplied.\nMarket-size, alcohol-cancer awareness, competitor revenue, and closure assertions in E17: research leads, not approved proof points.\nSpecific advocate identities and willingness to participate: E03 is too ambiguous to establish an endorsement.\nClinical modalities, staffing, licenses, accreditations, program eligibility, pricing, insurance terms, residence location, opening date, and availability: not confirmed for launch.\nShock Pulse Medical: separate venture in E07/E35/E36. Do not imply its technology or services are part of ZeroBooze without an explicit decision and evidence.\n\n\n7. Current website review\nReviewed October 13, 2026 at https://zerobooze.life/ through the visible site.\n\n\nW01 — Homepage\nCurrent lead: “You remember the moment.” Describes a brand taking shape around life without alcohol. Includes founder story, community, notebook, hat, and conversation invitation. Retain the human welcome and room for different experiences; make the purpose clearer sooner. The opening assumes a defining moment, which may fit less well for sober curious visitors.\n\n\nW02 — Founder story, https://zerobooze.life/story\nCurrent title: “I’m still in it.” The story acknowledges alcohol’s effects, prior attempts at change, choosing care, and building ZeroBooze while still in recovery. Keep its candor. Replace dated early-recovery timing and confirm personal details before republication. The personal thank-you names family and supporters; retain only with Keith’s approval of placement and wording. Use “recovery” rather than “treatment” in new brand copy while preserving exact quoted source records.\n\n\nW03 — Keith’s Notebook, opened from homepage\nTopics: common denominator across different histories; development of a first center in Florida; and the need for clinical, design, and construction expertise. It expressly states the center is not open. Preserve that availability distinction. These entries corroborate a development effort, not an operational residence.\n\n\nCurrent site limitation\nTexting is explicitly a preview and is not connected. Do not publish “Text ZeroBooze” as a working action until verified. Navigation and page structure differ from the requested new sitemap.\n\n\nThis review is a baseline, not a commitment to reuse the current design or all copy. The website draft below rebuilds the message around the primary audiences and Keith’s later direction.\n\n\nW04 — Store, https://zerobooze.life/merch\nThe visible collection preview lists hat, cap, visor, tumbler, polo, jug, and clear tumbler. It expressly says products, prices, and options are proposed for review and purchases are not enabled. The repeated $35 display is not adopted as approved pricing. Confirm the catalog, stock, fulfillment, and checkout before publishing Store copy.\n\n\n8. Recommended website architecture\nRecommended main navigation:\nAbout | Our Residence | Services | Resources | Store | Contact\nHome is reached through the logo. Add Horizon as a visible secondary link and a prominent homepage module.\n\n\nHome: explain what ZeroBooze means, invite the priority audiences, introduce community and Keith, and offer a useful next step.\nAbout / Our Story: the belief, founder origin, audience, and approach. Prefer a personal story to a conventional resume bio. [E18, E29–E30, E32]\nOur Residence: proposed replacement for Facility. While development continues, this page describes the intention and progress; it must not resemble an admissions page.\nServices: show available ways to engage first; label any clinical or residential offerings in development. If no services are operational, consider “Support” for the public navigation, with “Services” retained as the working sitemap label.\nResources: practical guidance, selected links, shared experiences, and the ongoing notebook. Proposed notebook label: “Along the Path.” Keith asked to reconsider “Notebook”; this label is a recommendation, not his approved wording. [E32]\nStore: merchandise and expression, with truthful product information and clear fulfillment policies.\nContact: a modest, usable invitation for general inquiries, stories, partners, and recruitment.\nHorizon: future centers, resources, virtual support, beverages/nutrition, and a charitable foundation, without implying launch dates. [E20, E39]\n\n\nPrimary conversion recommendation: a conversation or optional updates, supported by useful Resources. Buying is secondary. Keith’s stated goal is helping people live without alcohol and tell others, with traffic and positive feedback as early signals. [E32]\n\n\nCopy below is PROPOSED COPY. Editorial notes and source notes are not part of the public pages. Bracketed facts are missing inputs, not text to publish.\n\n\n9. Website copy — Home\nHERO\nLife without alcohol.\nA path that’s yours.\n\n\nZeroBooze began with someone who needed it first. We’re building a community for people living without alcohol, people finding their way toward it, and people beginning to ask what might change.\n\n\nYour story is yours. There’s room for it here.\n\n\nPrimary button: Explore Resources\nSecondary button: Meet ZeroBooze\n\n\nSources / status: proposed from E23/E32, supported by E09/E19. “Community” is an ambition in development; verify the actual participation experience before launch.\n\n\nCOMMUNITY MODULE\nYou don’t have to have it all figured out.\n\n\nMaybe you’re in recovery. Maybe something about your drinking has been on your mind. Maybe you’ve chosen life without alcohol for a reason entirely your own.\n\n\nWe want ZeroBooze to be a place to find useful perspectives, make a connection, and take a next step on your terms.\n\n\nButton: Start a Conversation\nSources: E23/E32. Activate only with a working channel.\n\n\nFOUNDER MODULE\nBuilt from a life. Built for more than one.\n\n\nKeith Polaski started ZeroBooze in the early days of his own sobriety. His experience is where this began. It’s also why we want to make room for stories that look nothing like his.\n\n\nButton: Read Our Story\nSources: E18/E23/E32; W02.\n\n\nRESOURCES MODULE\nSomething useful for your next step.\n\n\nPersonal reflections. Practical questions. Resources worth exploring. We’re bringing them together to help you navigate life without alcohol in a way that makes sense for you.\n\n\nButton: Visit Resources\nSources: E20/E32. Publish after initial resources are curated.\n\n\nHORIZON MODULE\nWe’re building what comes next.\n\n\nCommunity is the starting point. Our longer-term vision includes places for recovery, more ways to connect with support, and experiences that bring life without alcohol into everyday living.\n\n\nThese plans are taking shape. We’ll share progress as they develop.\n\n\nButton: See Our Horizon\nSources: E20/E32/E39; W03.\n\n\nSTORE MODULE\nCarry something that means something to you.\n\n\nZeroBooze merchandise is one way to express a connection. Wear it with pride, keep it personal, or let it start a conversation. There’s room for all of it.\n\n\nButton: Explore the Store\nSources: E22/E32. No purchase required for community participation.\n\n\nUPDATES MODULE\nStay connected as ZeroBooze grows.\n\n\nGet new reflections, useful resources, and updates on what’s taking shape. Choose to hear from us. Unsubscribe whenever you want.\n\n\nField: Email address\nButton: Keep Me Updated\nSources: E24/E32. Confirm privacy notice and working opt-in flow.\n\n\nSEO — proposed\nTitle: ZeroBooze | Life Without Alcohol, Your Story, Your Path\nDescription: Meet ZeroBooze, a community taking shape around life without alcohol. Explore our story, useful resources, and the vision we’re building together.\n\n\n10. Website copy — About\nHERO\nOur story starts with Keith.\nIt makes room for yours.\n\n\nZeroBooze was born in the early days of Keith Polaski’s sobriety, from a need he knew firsthand: a way to connect, find something useful, and build a life without alcohol that belonged to him.\n\n\nThat experience started the brand. The belief behind it reaches further. You own your story. You own your path. Support should respect both.\n\n\nSources: E18/E23/E32; W02.\n\n\nOUR BELIEF\nWe can walk with you.\n\n\nThe work of change is personal. No brand can do it for you. But connection can matter. So can a perspective you hadn’t considered, a resource you can use, or a conversation you didn’t know how to start.\n\n\nWe’re building ZeroBooze around those possibilities. A community shaped by different experiences, with empathy, personal ownership, and a willingness to keep asking what would help.\n\n\nSources: E09/E19/E32.\n\n\nKEITH’S STORY — first-person draft for Keith’s review\nI’ve spent much of my life building businesses. For a long time, alcohol was part of that life too. At work. At celebrations. On hard days. Eventually, more and more of it happened alone.\n\n\nI kept showing up. I kept building. I told myself that meant I was in control. It became harder to be honest about what alcohol was costing me and the people closest to me.\n\n\nWhen I chose to seek help, I was scared. Recovery asked me to look at myself differently. It also gave me a reason to think about what I wanted to build next.\n\n\nZeroBooze began there.\n\n\nI’m still doing the work. I’m sharing my experience because someone else may recognize part of their own. Your life may look very different from mine. Your reasons may be different too.\n\n\nWhat I want to build is something useful: a place for connection, resources, and honest conversations about life without alcohol.\n\n\nI can’t do the work for you. I hope we can walk some of the path together.\n\n\nKeith Polaski\nFounder, ZeroBooze\n\n\nSources: adapted from W02 and the origin draft in E18, with E32’s ownership principle. This is proposed founder copy, not a verbatim statement or approved personal disclosure. Confirm personal history and present-day wording with Keith.\n\n\nWHO THIS IS FOR\nFor people in recovery.\nFor people quietly concerned about their drinking.\nFor people who have lived without alcohol for years.\nFor people curious about a different way to live.\n\n\nYou don’t need the same history to find a connection.\n\n\nButton: Explore Resources\nSecondary button: Share a Note\nSources: E23/E32.\n\n\nSEO — proposed\nTitle: About ZeroBooze | Our Story and Belief\nDescription: Learn why Keith Polaski started ZeroBooze and how personal ownership, empathy, and community shape its vision for life without alcohol.\n\n\n11. Website copy — Our Residence\nEditorial status: DEVELOPMENT COPY. This page replaces “Facility” in the proposed sitemap. Do not publish specific features, services, admissions information, or renderings as completed facts. “Our Residence” requires confirmation that one property is the intended scope.\n\n\nHERO\nA place for recovery.\nBuilt around the person.\n\n\nWe’re working toward a ZeroBooze residence where personal ownership, meaningful support, and community can shape the experience of recovery.\n\n\nThe plans are still developing. The residence is not open, and we are not accepting residents through this page.\n\n\nSources: E25/E32/E39; W03. Operational status must be reconfirmed before publication.\n\n\nTHE INTENTION\nStart with what would help.\n\n\nA place for recovery should be shaped by the people who come there. Their lives. Their questions. The work they’re ready to do. The support that continues to matter when they leave.\n\n\nThat is the intention guiding this development. As decisions become real, we’ll explain what the residence will offer, who it will serve, and how the experience will work.\n\n\nSources: E32/E39; W03. Not a promise of a defined care model.\n\n\nPROGRESS MODULE\nFrom intention to a place.\n\n\nWe’ll share meaningful milestones as the work develops: site decisions, design progress, the people shaping the approach, and confirmed information about opening.\n\n\nButton: Follow Our Progress\nSecondary button: Ask About the Vision\nSources: E39 milestones; W03.\n\n\nFUTURE CONTENT REQUIRED\n[Verified location and address]\n[Approved architectural imagery, labeled as renderings]\n[Opening status and date, if established]\n[Residential program eligibility and scope]\n[Licensing, accreditation, and clinical leadership]\n[Accessibility, accommodation, and verified amenities]\n[Program duration and after-care arrangements]\n\n\nSEO — proposed\nTitle: Our Planned Residence | ZeroBooze\nDescription: Explore ZeroBooze’s vision for a residence shaped around personal ownership, recovery, and community. Follow development updates as plans take shape.\n\n\n12. Website copy — Services\nEditorial status: AVAILABLE SUPPORT + FUTURE PLANS. Confirm every listed live offering. Consider the public navigation label “Support” while clinical services are still in development.\n\n\nHERO\nSupport for a path that’s yours.\n\n\nPeople need different things at different moments. A useful resource. A new perspective. A connection. Sometimes, professional support.\n\n\nZeroBooze is developing ways to help people navigate those needs while keeping ownership of their own story.\n\n\nSources: E20/E32.\n\n\nAVAILABLE WAYS TO CONNECT — publish only when working\nExplore Resources\nFind reflections and selected resources for life without alcohol. Start with what feels relevant to you.\nButton: Browse Resources\n\n\nStart a Conversation\nHave a question, a thought, or something you’d like to share? A short note is enough. You decide how much to tell us.\nButton: Contact ZeroBooze\n\n\nFollow Along\nGet occasional updates as the community and broader vision develop.\nButton: Receive Updates\n\n\nSources: E24/E32; W01. These are participation functions, not clinical counseling. Response times and availability are not promised.\n\n\nIN DEVELOPMENT\nA wider vision for support.\n\n\nOur plans include residential recovery, virtual professional support, and continued support beyond a residential stay. We’re also exploring ways to connect people with resources and others who understand their experience.\n\n\nThese offerings are in development. This page is not an invitation to book clinical or residential services.\n\n\nButton: Explore Our Horizon\nSources: E20/E32/E39. Confirm exact scope and terminology before launch.\n\n\nSERVICE-PAGE TEMPLATE — reuse when an offering is verified\nService name / who it is for / what it includes / provider or team / format and location / availability / cost and payment / exclusions / next step / supporting credentials / date verified.\n\n\nSEO — proposed\nTitle: Support and Future Services | ZeroBooze\nDescription: Explore ways to connect with ZeroBooze and learn about the recovery and support offerings in development.\n\n\n13. Website copy — Resources\nHERO\nUseful perspectives.\nRoom to find your own.\n\n\nLife without alcohol comes with questions. We’re building a collection of personal reflections, practical ideas, and selected resources to help you explore yours.\n\n\nStart where you are. Take what is useful.\n\n\nSources: E20/E24/E32.\n\n\nRESOURCE COLLECTIONS — proposed editorial categories\nThinking About a Change\nQuestions and perspectives for people beginning to look at their relationship with alcohol.\n\n\nLiving Without Alcohol\nEveryday experiences, routines, food, and connection. A life that can be shaped around what matters to you.\n\n\nFinding Support\nInformation about different kinds of support, with clear links to the people and organizations providing it.\n\n\nStories From the Community\nDifferent experiences, shared with permission and in each person’s own voice.\n\n\nAlong the Path\nNotes from Keith and the people helping shape ZeroBooze: what we’re learning, what’s developing, and what we’re still working through.\n\n\nSources: E19/E23/E24/E32. No resource collection is represented as populated until reviewed content exists.\n\n\nINVITATION\nSomething helped you?\nWe’d like to hear about it.\n\n\nA resource, a perspective, or an experience may be useful to someone else. Send us a suggestion. We’ll review it before sharing.\n\n\nButton: Suggest a Resource\nSources: E32; proposed implementation.\n\n\nRESOURCE EDITORIAL NOTE\nEach published resource needs an original source, purpose, intended audience, date checked, availability or geographic limits, author credentials where relevant, and a clear distinction between personal experience and professional guidance. Any sponsor or affiliate relationship must be identified. The word list’s appendix is a starting lead, not a checked directory.\n\n\nSEO — proposed\nTitle: Resources for Life Without Alcohol | ZeroBooze\nDescription: Explore personal reflections, practical ideas, and selected resources for life without alcohol, with room for your story and your next step.\n\n\n14. Website copy — Store\nHERO\nMake it yours.\n\n\nZeroBooze merchandise gives you a way to carry a connection into everyday life. Wear it with pride. Keep the meaning personal. Let it open a conversation.\n\n\nThe meaning is yours to make.\n\n\nSources: E22/E32; W01.\n\n\nSTORE INTRO\nA considered collection.\n\n\nWe’re starting with ZeroBooze merchandise and building from there. Each product page should tell you exactly what you’re choosing: materials, fit, colors, care, price, and delivery details.\n\n\nBrowse the collection and choose what suits you.\n\n\nEditorial note: the second paragraph is consumer-facing guidance; confirm it matches actual product-page detail. Do not use “premium,” manufacturer names, or quality guarantees without product evidence. The asset inventory lists wearables and other branded material, but inventory and availability need confirmation. [E08/E27/E31/E32]\n\n\nSAMPLE PRODUCT COPY — hat\nThe ZeroBooze Hat\nA simple way to carry something that matters to you.\n\n\n[Verified fabric and construction]\n[Verified size and adjustment]\n[Available colors]\n[Price]\n[Care instructions]\n[Shipping estimate and return policy]\nButton: Add to Bag\n\n\nCONNECTION MODULE\nMore than something to buy.\n\n\nThe store is one part of ZeroBooze. The larger purpose is connection, useful support, and a community around life without alcohol.\n\n\nButton: Meet ZeroBooze\nSources: E09/E22/E32.\n\n\nFUTURE PARTNER PRODUCTS\nBeverages, nutrition, affiliate relationships, and resale are exploratory in the September notes. Do not imply they are in stock, ZB-made, or formally endorsed. Do not promise a donation or foundation contribution from purchases without a verified mechanism.\n\n\nSEO — proposed\nTitle: ZeroBooze Store | Merchandise With Personal Meaning\nDescription: Explore ZeroBooze merchandise and choose something that expresses your connection to life without alcohol. View product details and availability.\n\n\n15. Website copy — Contact\nHERO\nA simple hello is enough.\n\n\nHave a question, an idea, or a story you’d like to share? Start with a note. You don’t have to explain everything.\n\n\nSources: E24/E32; W01.\n\n\nFORM INTRO\nWhat would you like to talk about?\n\n\nSuggested topics:\nGeneral question\nShare a story or resource\nPartnership or collaboration\nFuture opportunities\nStore or order question\n\n\nSuggested fields:\nName\nEmail address\nTopic\nMessage\n\n\nButton: Send My Note\n\n\nAcknowledgment — proposed:\nThanks for reaching out. We’ve received your note. We’ll respond as soon as we can.\n\n\nSources: E32. Use acknowledgment only after successful delivery. Do not promise a response window until one is agreed.\n\n\nUPDATES OPT-IN — separate, optional checkbox\nI’d like to receive occasional ZeroBooze updates by email.\n\n\nSTORY-SHARING NOTE — proposed\nSending us your story does not give us permission to publish it. If we’d like to share any part, we’ll ask you first.\n\n\nCONVERSATION SCOPE\nThis is for general questions and conversation. Replies are not immediate, and this channel is not monitored for urgent support.\n\n\nSources: W01; E32. Add a separate clinically reviewed urgent-help route if appropriate before launch. Do not invent a monitored crisis service.\n\n\nDIRECT TEXTING — hold until verified\nButton: Text ZeroBooze\nOpening message: Hi, welcome to ZeroBooze. You’re welcome to leave a question or a note. You decide how much to share. Replies aren’t immediate.\n\n\nKeep the brand in front; explain who handles messages where helpful. Do not expose Keith’s personal number or publish the billing address from the agreement as a residence address. [E32/E37]\n\n\nSEO — proposed\nTitle: Contact ZeroBooze | Questions, Stories and Connections\nDescription: Get in touch with ZeroBooze to ask a question, share a perspective, explore a collaboration, or learn about what’s developing.\n\n\n16. Website copy — Horizon\nHERO\nOur Horizon.\nWhat we’re working toward.\n\n\nZeroBooze begins with a belief: you own your story and your path to life without alcohol. Our ambition is to build more ways to support that path.\n\n\nSome pieces are already taking shape. Others are still ideas we’re working through. We’ll be clear about the difference.\n\n\nSources: E20/E32/E39.\n\n\nPLANNED AREAS\nPlaces for Recovery\nA vision for residential settings shaped around personal ownership, support, and the experience of the people who come there.\n\n\nMore Ways to Find Support\nExploring virtual professional support, continued connection, and resources for different stages of alcohol-free living.\n\n\nEveryday Life\nExploring products, partnerships, beverages, nutrition, and experiences that fit a life without alcohol.\n\n\nA Charitable Future\nA vision for a ZeroBooze charitable foundation. Its structure, purpose, and activities are still to be developed.\n\n\nCommunity That Grows With Us\nShared stories, meaningful connections, and opportunities to gather as the community takes shape.\n\n\nSources: E20/E32/E39. No implied service availability, charitable registration, tax deductibility, partner commitment, or launch schedule.\n\n\nINVITATION\nHelp shape what comes next.\n\n\nWhat would have helped you? What would help now? Your perspective can inform what we build.\n\n\nButton: Share Your Perspective\nSecondary button: Follow Our Progress\nSources: E32; proposed copy.\n\n\nSEO — proposed\nTitle: Our Horizon | The Future of ZeroBooze\nDescription: Explore ZeroBooze’s developing vision for community, recovery residences, support, everyday living, and a charitable future.\n\n\n17. Social, email, and editorial content bank\nProposed channel roles, informed by Keith’s Facebook, Instagram, YouTube, and Substack list [E28]:\nFacebook: conversation and community participation.\nInstagram: short stories, visual identity, useful prompts, everyday alcohol-free living.\nYouTube: founder introduction, thoughtful conversations, and longer stories.\nSubstack or a site-based publication: regular reflections and progress updates. Choose one primary publishing home before duplicating effort.\n\n\nThe platform list is Keith’s initial preference; no current account status or active audience is assumed. Begin with a sustainable cadence, proposed at one substantive note each week plus adaptations, and adjust to response. Keith says rhythm can follow the community. [E24/E32]\n\n\nSOCIAL DRAFT 01 — introduction\nZeroBooze began with someone who needed it first. We’re building a community around life without alcohol—with room for different stories, different reasons, and a path that’s yours. Get to know what we’re building.\nCTA: Read Our Story\nSources: E23/E32.\n\n\nSOCIAL DRAFT 02 — quietly concerned\nYou don’t have to know exactly what comes next to start asking questions. If alcohol has been on your mind, there’s room for that conversation here.\nCTA: Explore Resources\nSources: E25/E32.\n\n\nSOCIAL DRAFT 03 — community\nDifferent histories. Different reasons. Life without alcohol can be the connection without becoming your whole identity.\nCTA: Share a Perspective\nSources: E23/E32; W03.\n\n\nSOCIAL DRAFT 04 — accountability with support\nYou own your story. You own the work. We want to help you find useful resources and people to walk with you.\nCTA: Meet ZeroBooze\nSource: E32.\n\n\nSOCIAL DRAFT 05 — founder practice\nEvery day. Every relationship. Every time.\nFor Keith, these words describe a standard he’s trying to live. What does personal accountability look like in your day?\nSources: E13/E16. Attribute the phrase to the conversation, not to a newly invented campaign.\n\n\nSOCIAL DRAFT 06 — progress\nWe’re building ZeroBooze deliberately, and we want to share the work as it develops. New reflections, useful resources, and honest updates on what’s still ahead.\nCTA: Receive Updates\nSources: E24/E32.\n\n\nEMAIL WELCOME — proposed\nSubject: Welcome to ZeroBooze\nPreview: Your story belongs here.\n\n\nThanks for connecting with ZeroBooze.\n\n\nPeople come to life without alcohol for different reasons. Some have been here for years. Some are just beginning. Some are still asking questions.\n\n\nWe’re building a community with room for those differences. We’ll share useful resources, personal reflections, and updates as the larger vision takes shape.\n\n\nStart wherever feels right: read our story, explore resources, or send a note. You choose how much to share.\n\n\nZeroBooze\nSources: E09/E23/E24/E32. Link only to working destinations; include unsubscribe and the required sender details in the actual email system.\n\n\nEDITORIAL STARTERS — proposed, source-grounded\nWhat would have helped you at the beginning? [E17/E32]\nWhy a person should not have to explain everything to belong. [E19/E32]\nWhat “with you” means—and what it doesn’t promise. [E32]\nThe Quietly Concerned: opening a conversation without imposing a label. [E25/E32]\nGratitude and looking in the mirror: two practices Keith wants to coexist. [E13]\nA recipe, an everyday ritual, or an alcohol-free gathering worth sharing. [E32]\nA transparent update on residence development. [W03/E39]\nHow we evaluate a resource before recommending it. [E20/E32]\n\n\nTranscript-based video repurposing is developed in Section 21. Exact excerpts, phrase anchors, captions, and production notes are supplied. Capture actual clip timecodes from the master videos and obtain approval before editing or posting.\n\n\n18. Sales, partnerships, and recruitment\nPARTNER OVERVIEW — proposed\nZeroBooze is building a community around life without alcohol, grounded in personal ownership, useful support, and lived experience. We’re interested in collaborators whose work can add something meaningful for that community.\n\n\nWe’re developing the brand deliberately. The right relationship should fit the audience, add practical value, and be clear about what each partner is offering.\n\n\nSources: E22/E32.\n\n\nPARTNER SELECTION — proposed\nEvaluate audience fit, product or service quality, credibility, usefulness, relationship type, and disclosure needs. Keith is exploring both resale and affiliate models. Follower count is one input, not the proposition. [E32]\nPossible leads: sober activities/golf introduction in E08; beverage/nutrition relationships and eith approval / publication link / published date / next review date.\n\n\nRULES FOR ATTRIBUTION\nAttribute Keith’s words to Keith, Dustin’s proposals to Dustin, and new copy to this working draft. A forwarded message is not proof of agreement. Use the latest explicit direction when earlier advice conflicts; retain the older position in the decision history.\n\n\nFor new language inspired by a source, write “informed by,” not “Keith said.” For verbatim quotations, preserve wording and identify the original date. Link related assets to the email that supplied them.\n\n\nAPPROVAL PATH — recommended\nEditorial draft → source and language check → factual/operational review → Keith review → approved version → publish → record live URL.\nClinical claims need appropriate expert review and evidence before entering approved consumer copy. No automatic scheduling or posting is authorized by this document.\n\n\nSUCCESS MEASURES — proposed\nMeaningful replies and story/resource submissions; opted-in subscribers; repeat visits and resource use; qualified partner inquiries; useful feedback from priority audiences; successful resolution of contact/order questions. Track traffic and sentiment as Keith requested. Do not equate follower volume or merchandise sales with recovery outcomes. [E02/E22/E32]\n\n\nNEXT INPUTS THAT CHANGE THE COPY\nOperational status: what actually exists today?\nResidence scope, geography, status, and approved terminology.\nAny active professional or virtual service and its provider.\nConfirmed program design, duration, post-care, and payment terms.\nVerified store inventory, materials, price, shipping, and returns.\nWorking contact route, ownership, response expectation, and privacy notice.\nApproved founder history and personal acknowledgments.\nVerify clip timecodes and transcript wording against all four master recordings; supplied transcripts are now incorporated in Sections 21–23.\nApproval of “Our Residence,” “Along the Path,” public audience language rent, personal, deep stories.”\nTarget: 10–15 seconds.\nHook — proposed: Different stories. A shared thread.\nCaption — proposed: Life without alcohol can connect us without making our lives identical. There’s room for the parts of your story that are yours alone.\nCTA: Read Our Story.\nEditorial note: “joint ownership” elsewhere in this paragraph means participation in shaping the brand. Do not imply legal equity or ownership rights.\n\n\nCLIP C10 — A moving horizon\nSource: V03, third paragraph.\nLocate: “even though it's a game that doesn't have a final second on the clock. There's a horizon that continues to move away from you.”\nTarget: 15–25 seconds including enough lead-in to make the metaphor understandable.\nHook — proposed: The horizon keeps moving.\nCaption — proposed: For Keith, life without alcohol is something he continues to practice. Personal ownership and community remain part of that path.\nCTA: Read Along the Path.\nEditorial note: do not isolate “in it to win it” as a promise of success. Exclude the earlier generalized claim that family pressure diminishes the likelihood of success unless properly reviewed and supported.\n\n\nCLIP C11 — Why he’s building it\nSource: V04, second paragraph.\nExact quote: “I am not in this to make money. I'm in this to help people find and embrace a life without alcohol.”\nTarget: 10–20 seconds.\nHook — proposed: The reason behind ZeroBooze.\nCaption — proposed: Keith’s motivation is personal: helping people find and embrace life without alcohol. That belief is guiding what we build next.\nCTA: Meet Keith.\nEditorial note: this states his motivation. It does not establish nonprofit status, free services, or where store revenue goes.\n\n\nCLIP C12 — Experience with purpose\nSource: V04, second paragraph.\nLocate: “That doesn't mean I can't bring my business experiences to bear upon the product that is delivered” through one or more examples.\nTarget: 20–35 seconds.\nHook — proposed: Bringing a builder’s experience to
