the name into two words or using all-lowercase or all-capital lettering in typeset text.\n\nSource: Dave’s confirmed naming direction, October 14, 2026. This supersedes earlier naming and spelling questions in the hub.\n\nThe hub’s text and displayed source labels have been standardized to the confirmed spelling. Original source files and approved logo artwork retain their supplied filenames and artwork; source links still point to the original records.", "category": "Strategy", "type": "Brand rule", "status": "Confirmed direction", "section": "25"}, {"id": "brand-purpose", "title": "Purpose — why we exist", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nMake life without alcohol feel more possible, more connected, and more personal.\n\nWHAT THIS MEANS\nPeople deserve room to imagine what life without alcohol could hold, ask honest questions, and find connection without having to fit someone else’s story.\n\nHOW TO USE IT\nThe purpose is the enduring reason behind the brand. Use it to assess ideas, partnerships, experiences, and creative work. It is not a tagline or a claim of clinical effectiveness.\n\nSOURCE BASIS\nE23, E32; V01–V04; Dave’s End game theme supplied October 14, 2026.", "category": "Strategy", "type": "Brand foundation", "status": "Proposed — Keith review", "section": "BF-purpose"}, {"id": "brand-mission", "title": "Mission — what we are here to do", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nHelp people find and embrace life without alcohol through connection, useful perspectives, and support that respects their own story and path.\n\nIN PRACTICE\nCreate useful content. Invite honest conversations. Make room for different experiences. Develop future support thoughtfully, with clear information about what is available and what is still taking shape.\n\nSHORT INTERNAL VERSION\nHelp people build a life without alcohol that belongs to them.\n\nAPPLICATION\nUse the full mission in brand documents, company introductions, and team alignment. The short version is an internal reminder, not an additional approved tagline. “Support” expresses the mission; specific care or services require their own verified description.\n\nSOURCE BASIS\nE09, E23, E32; V01 and V04. The phrase find and embrace life without alcohol draws from Keith’s stated purpose; the full mission is new draft language.", "category": "Strategy", "type": "Brand foundation", "status": "Proposed — Keith review", "section": "BF-mission"}, {"id": "brand-vision", "title": "Vision — the future we want to help create", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nA future where people can see an enjoyable life without alcohol ahead of them—and find connection and support that respect who they are.\n\nTHE AMBITION\nBring a fuller view of alcohol-free living into reach: everyday enjoyment, meaningful relationships, personal agency, and appropriate support. Let community and future residential development contribute to that ambition in ways that are honest about their scope.\n\nHOW IT DIFFERS FROM THE MISSION\nThe mission describes our work. The vision describes the future that work should contribute to. Neither promises a particular outcome for an individual.\n\nSOURCE BASIS\nE20, E32; V01, V03, V04; Dave’s End game theme. Residential and other service ambitions remain future plans.", "category": "Strategy", "type": "Brand foundation", "status": "Proposed — Keith review", "section": "BF-vision"}, {"id": "brand-values", "title": "Values — how we act", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\n1. RESPECT THE WHOLE PERSON\nA person is more than a label, a difficult chapter, or a shared experience with alcohol. Listen before assuming. Respect differences and the decision to keep something personal.\nBehavior: ask how someone wants their story used; get permission before sharing it.\nDecision test: does this preserve the person’s dignity and choice?\n\n2. PAIR OWNERSHIP WITH SUPPORT\nPeople have agency in their own lives. They also deserve help that meets their needs. Accountability should come with empathy and room for professional care.\nBehavior: invite a next step without issuing a verdict or implying someone should do everything alone.\nDecision test: are we encouraging agency without adding blame?\n\n3. PUT CONNECTION FIRST\nBuild relationships around usefulness, participation, and mutual regard. A purchase, public disclosure, or polished story is not the price of belonging.\nBehavior: make resources easy to reach; offer ways to participate quietly; keep merchandise secondary.\nDecision test: would this still be useful to someone who never buys anything?\n\n4. BE HONEST ABOUT THE WORK\nSay what exists, what we know, and what is still developing. Make the strength of a claim match the evidence behind it.\nBehavior: distinguish concept visuals from built spaces, founder experience from professional credentials, and future plans from available services.\nDecision test: could someone reasonably misunderstand what we are offering today?\n\n5. MAKE IT USEFUL, THEN KEEP IMPROVING\nListen, learn, and turn good intentions into things people can use. Question a convention when there is a clear reason, then show the work behind a better approach.\nBehavior: act on feedback, check resources, and explain meaningful changes.\nDecision test: what practical value does this add, and how will we know?\n\nHOW TO USE THE VALUES\nValues guide team conduct, partner choices, editorial decisions, and the experience of the brand. They are behavioral commitments, not claims that a future residential program has already delivered results.\n\nSOURCE BASIS\nE02, E09, E23, E24, E32; V02–V04; confirmed story ownership, community-first direction, and evidence boundaries in hub Sections 4–6.", "category": "Strategy", "type": "Values", "status": "Proposed — Keith review", "section": "BF-values"}, {"id": "brand-positioning", "title": "Positioning — the role we want to occupy", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nINTERNAL POSITIONING STATEMENT\nFor people in recovery and people quietly questioning alcohol’s place in their lives, ZeroBooze is a developing brand and community around life without alcohol. Built from lived experience, it brings together useful perspectives and opportunities for connection while working toward a wider vision for recovery and support. It respects the individual’s ownership of their story and makes room for the everyday life they want to build.\n\nTHE ROLE\nA thoughtful companion and a purposeful builder: help people find something useful now, and be clear about what we are working toward next.\n\nWHAT WE WANT PEOPLE TO UNDERSTAND\nThis began with someone who needed it first.\nThere is room for experiences that look different from his.\nYour story and your choices remain yours.\nLife without alcohol can hold more than the absence of drinking.\n\nCREDIBILITY TO BUILD FROM\nKeith’s lived experience and clearly attributed founder perspective.\nHis stated commitment to helping people find and embrace life without alcohol.\nUseful, source-grounded content and transparent development updates as they are delivered.\n\nDISTINCTION TO DEMONSTRATE\nOwnership with companionship. A community larger than its founder’s story. Everyday life alongside a wider recovery vision. These are strategic directions to make tangible, not independently proven competitive advantages or exclusive claims.\n\nPUBLIC DESCRIPTION\nZeroBooze is a community taking shape around life without alcohol, with room for different stories, useful perspectives, and a path that belongs to you.\n\nSOURCE BASIS\nE18, E23, E29–E32; V01–V04. Uses the hub’s existing working positioning and preserves current-versus-future distinctions.", "category": "Strategy", "type": "Positioning", "status": "Proposed — Keith review", "section": "BF-positioning"}, {"id": "brand-pillars", "title": "Brand pillars — what our messages return to", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nPILLAR 1 — YOUR STORY BELONGS TO YOU\nCore idea: people can share a connection without sharing the same history or identity.\nMessage: your experience matters, and you decide what to share.\nExpression: “Your story is yours. There’s room for it here.”\nUse in: Our Story, founder content, community stories, consent language, invitations to contribute.\nEvidence: founder and community transcripts, used in context; actual consent practices.\nCreative cue: different people and ordinary details; avoid reducing someone to a symbolic recovery portrait.\n\nPILLAR 2 — YOUR PATH, WITH SUPPORT\nCore idea: ownership and companionship belong together.\nMessage: the work is personal, and appropriate support can be part of it.\nExpression: “A next step that’s yours. People to walk with you.”\nUse in: Resources, Inquire, future service explanations, thoughtful calls to action.\nEvidence: clear resource links, a functioning inquiry route, and verified services only when available.\nCreative cue: agency and forward movement; avoid rescue imagery or language suggesting willpower is sufficient.\n\nPILLAR 3 — BELONGING WITHOUT LABELS\nCore idea: connection should not require a purchase, a public declaration, or a prescribed identity.\nMessage: you can start with a question, read quietly, or bring your own perspective.\nExpression: “You don’t need the same story to belong.”\nUse in: The Community, Find Your People, welcome messages, social prompts.\nEvidence: accessible content, optional participation, and respectful handling of submissions.\nCreative cue: natural connection and room to participate at different levels; no invented testimonials or community scale.\n\nPILLAR 4 — A LIFE TO LOOK FORWARD TO\nCore idea: the ambition includes the life someone wants to make room for beyond alcohol.\nMessage: everyday enjoyment, relationships, and personal interests deserve space in the story.\nExpression: “What do you want to make room for?”\nUse in: Living Zero, lifestyle content, editorial themes, and the End game message.\nEvidence: thoughtful everyday content and consented individual experiences; do not imply these prove recovery outcomes.\nCreative cue: credible ordinary moments; warmth and possibility without glossy perfection.\n\nHOW TO APPLY THE PILLARS\nChoose one lead pillar for a module or execution; a supporting pillar can deepen it. Do not force all four into every headline. Values describe how we behave; pillars describe the messages we return to. Mission and vision set their purpose.\n\nEDITORIAL CONTINUITY\nThis four-pillar system refines the earlier working message pillars in hub Section 4. The earlier Build deliberately and Question conventions themes remain important and are now captured primarily in the values Be honest about the work and Make it useful, then keep improving.\n\nSOURCE BASIS\nE09, E23, E24, E32; V01–V04; existing hub Section 4 and Dave’s End game theme. All expression lines are proposed copy, not founder quotations.", "category": "Strategy", "type": "Brand pillars", "status": "Proposed — Keith review", "section": "BF-pillars"}, {"id": "brand-promise", "title": "Brand promise — the standard we set", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nYour story will be respected. Our part will be clear.\n\nWHAT THE PROMISE MEANS\nRespect the person’s perspective, privacy, and agency. Explain what the brand can offer and where its limits are. Make participation an invitation rather than a demand.\n\nWHAT MUST MAKE IT TRUE\nClear consent before a story is published.\nTransparent labels for future plans and available resources.\nA working contact route with accurate expectations.\nUseful content that does not depend on a purchase.\nAppropriate boundaries between community connection and clinical care.\n\nAPPLICATION\nThis is a proposed experience promise and a standard for decisions, not a guarantee of recovery, confidentiality in every system, or individual results. Agree on the practices behind it before adopting it as public promise language.\n\nSOURCE BASIS\nE23, E32; V02–V04; hub attribution, consent, contact-scope, and availability guidance.", "category": "Strategy", "type": "Brand promise", "status": "Proposed — Keith review", "section": "BF-promise"}, {"id": "brand-personality", "title": "Personality — how the brand feels", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nHUMAN\nSpeak to a person. Show interest in their experience. Leave room for uncertainty and for more than one way of describing a life.\n\nCANDID\nSay something clear and true. Avoid dramatizing a story, minimizing difficulty, or polishing away the parts that make it believable.\n\nASSURED\nGive people a useful starting point. Confidence comes from clarity and care, not volume, superiority, or promises we cannot substantiate.\n\nTHOUGHTFUL\nMake deliberate choices about language, imagery, access, and consent. Create a premium feeling through attention and respect.\n\nPURPOSEFUL\nBuild toward something useful. Show progress through concrete decisions and completed work rather than announcing disruption as a personality.\n\nIN ONE SENTENCE\nA candid, thoughtful companion with the determination of a builder.\n\nFOR DESIGNERS\nGive words and people room. Use clear hierarchy, calm pacing, legible type, and deliberate details. Show lived-in human moments and label concept property imagery. The person should remain more important than a visual metaphor.\n\nFOR WRITERS\nWrite with warmth, directness, and restraint. Let a specific observation carry the feeling. Avoid motivational speeches, corporate polish, and a heroic founder narrative that crowds out the visitor.\n\nSOURCE BASIS\nE10, E18–E19, E23–E25, E32; hub Sections 2 and 4. This translates the source direction into a proposed personality system.", "category": "Strategy", "type": "Brand personality", "status": "Proposed — Keith review", "section": "BF-personality"}, {"id": "brand-voice", "title": "Voice & tone — how we put it into words", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nVOICE\nConversational, direct, warm, and sure of itself. Write to one person. Use natural paragraphs and specific language. Make a next step understandable without pressuring someone to take it.\n\nFOUR WRITING RULES\n1. Start with recognition. A question or an ordinary moment can create an opening without assuming someone’s history.\n2. Respect agency. Use invitations and choices; do not assign labels or decide what someone’s experience means.\n3. Put something useful within reach. Give a clear destination, a practical perspective, or an honest answer.\n4. Let the wording match the facts. A future idea is a future idea. A personal experience is not a universal result.\n\nTONE BY SITUATION\nWelcome: open and unhurried. “Start where it feels right.”\nQuiet concern: gentle and specific. “You can begin with a question.”\nFounder story: candid and personal, then turn toward the visitor.\nResources: practical and clear, with sources where needed.\nThe House: thoughtful and concrete; retain development status until facts change.\nInquiries: warm and straightforward about response and scope.\nRecruitment and partnerships: purposeful, factual, and clear about what is defined.\n\nBEFORE AND AFTER\nInstead of: “Embark on a transformative journey.”\nUse: “Find a next step that makes sense for you.”\n\nInstead of: “We know exactly how you feel.”\nUse: “Your experience may be different. There’s room for it here.”\n\nInstead of: “Take control. No excuses.”\nUse: “Your choices matter. So does the support around you.”\n\nInstead of: “Our revolutionary approach changes lives.”\nUse: “Here’s what we’re developing, and why it matters.”\n\nInstead of: “Join our thriving community.”\nUse: “Explore the community taking shape.”\n\nLANGUAGE RULES TO RETAIN\nZeroBooze: one word, capital Z and B.\nResident Guests in residential contexts; people or community members elsewhere.\nPath, recovery, relief, support, ownership, connection, and life without alcohol.\nThe House for the current website’s planned residential setting; avoid facility and campus in new brand copy.\nUse Quietly Concerned internally rather than assigning that label to a visitor.\nDo not use the word list to manufacture operational facts or outcome claims.\n\nSOURCE BASIS\nE10, E18–E19, E23–E25, E32, E39; confirmed naming and Resident Guests updates from Dave, October 14; October 20 website navigation brief.", "category": "Strategy", "type": "Voice guide", "status": "Proposed — Keith review", "section": "BF-voice"}, {"id": "brand-manifesto", "title": "Manifesto — the belief in full", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nThere is a life to be lived without alcohol.\n\nA life with your own reasons, your own questions, and things you want to make room for. A conversation that stays with you. Time for something you enjoy. People you can be yourself around.\n\nYou may have been living that life for years. You may be doing the work of recovery. You may be quietly wondering what needs to change. You do not need to make your story look like someone else’s before it matters.\n\nZeroBooze began with someone who needed it first. Keith’s experience gave him a reason to build. The purpose reaches beyond one person, because a shared connection should have room for many different lives.\n\nWe believe your story belongs to you. You decide what to share, what to keep personal, and which questions you are ready to ask.\n\nWe believe ownership and support belong together. Making a choice for yourself can include asking for help. The people who walk beside you and the care that fits your needs can be part of a path that remains your own.\n\nWe want connection to come before a transaction. Useful perspectives should be within reach. A purchase or a public declaration should never be the price of being welcomed.\n\nAnd we believe good intentions need honest work behind them. We will be clear about what we can offer, what is still developing, and where we need to listen, learn, and do better.\n\nThe ambition is an enjoyable life without alcohol. Not a picture of perfection, but room for ordinary good moments, meaningful relationships, and possibilities that feel like yours.\n\nYour story. Your path.\n\nLet’s make room for what comes next.\n\nUSAGE NOTE\nThis is newly written brand copy for review, not a quotation from Keith or a clinical promise. Use as the long-form belief statement in brand presentations, internal orientation, or a considered editorial module. The closing lines are proposed expressions, not approved logo lockups.\n\nSOURCE BASIS\nE09, E18, E23, E32; V01–V04; Dave’s End game theme. New manifesto language synthesized from these themes.", "category": "Strategy", "type": "Brand manifesto", "status": "Proposed — Keith review", "section": "BF-manifesto"}, {"id": "brand-message-map", "title": "Message hierarchy — what to lead with", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nFIRST: THE HUMAN INVITATION\nLife without alcohol. A path that’s yours.\nHelp someone understand the brand and see a place for their experience.\n\nSECOND: THE BELIEFS\nYour story belongs to you. Ownership can include support. Connection makes room for differences. Everyday life deserves a place in the picture.\n\nTHIRD: SOMETHING TANGIBLE\nAn article to read, an attributed founder perspective, a functioning way to inquire, or a clearly described development update. Let the action match what exists.\n\nFOURTH: THE WIDER VISION\nIntroduce The House and future support with transparent availability language. Do not let future scale or investor ambition crowd out the visitor’s immediate question.\n\nBY WEBSITE PAGE\nThe House: Your path, with support; show development status.\nThe Community: Belonging without labels; make room for different experiences.\nLiving Zero: A life to look forward to; show ordinary, credible possibilities.\nOur Story: Your story belongs to you; Keith’s origin opens the door to other voices.\nThe Pledge: connect the values to commitments the brand can stand behind.\nFind Your People: offer a clear, deliverable way to connect.\nResources: make the next useful perspective easy to find.\nInquire: make the invitation warm, usable, and clear about scope.\n\nBY AUDIENCE\nPeople in recovery: agency, respect, and support; no promises of results.\nPeople quietly concerned: recognition and a manageable invitation; no required label or public disclosure.\nPeople living without alcohol for years: connection, contribution, and respect for experience.\nPeople exploring alcohol-free living: room for different reasons.\nLoved ones: listen, learn, respect the individual’s choices, and maintain appropriate boundaries.\nProfessional partners and future team members: purpose plus verified scope, roles, and evidence.\n\nDO NOT CONFUSE THE LAYERS\nPurpose: why the brand exists.\nMission: the work it is here to do.\nVision: the future it wants to contribute to.\nValues: how it behaves.\nPillars: the themes its communications return to.\nPromise: the experience standard it sets.\nManifesto: a fuller expression of the belief.\nA campaign theme: a specific creative expression built from this foundation, not a replacement for it.\n\nSOURCE BASIS\nHub Sections 3, 4, 6, 8 and 19; Dave’s October 20 navigation brief. Proposed application guidance.", "category": "Strategy", "type": "Messaging", "status": "Proposed — Keith review", "section": "BF-message-map"}, {"id": "brand-boilerplate", "title": "Brand story & reusable descriptions", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nBRAND STORY\nZeroBooze began in the early days of Keith Polaski’s sobriety, when his own experience gave him a reason to build something more personal.\n\nHe wanted to turn what he was learning into something useful for others: a place for connection, honest perspectives, and questions about life without alcohol.\n\nThe belief behind it reaches beyond his own story. People have different histories and different reasons for change. They should be able to find something that speaks to them without being asked to become someone else.\n\nToday, ZeroBooze is a brand and community taking shape around that belief, with a wider vision for recovery and support. Its purpose is to make room for the individual and for the life they want to build.\n\nONE-SENTENCE DESCRIPTION\nZeroBooze is a community taking shape around life without alcohol, built from lived experience and with room for different stories and paths.\n\nSHORT DESCRIPTION\nZeroBooze began with Keith Polaski’s own experience of sobriety and a wish to build something useful for others. It brings together perspectives, resources, and invitations to connect around life without alcohol, while developing a wider vision for recovery and support.\n\nREUSABLE OPENING\nYou don’t have to have it all figured out. You can start with a question, a story, or something useful to read.\n\nEXPRESSIONS TO EXPLORE\nYour story. Your path.\nLife without alcohol. Room to make it yours.\nWhat do you want to make room for?\n\nEDITORIAL STATUS\nDescriptions are proposed copy. Founder history requires Keith’s approval for public use. Descriptive lines are not assumed approved taglines. Keep future residential and clinical offerings clearly identified as plans.\n\nSOURCE BASIS\nE18, E23, E32; W02; V01–V04. Uses established hub narrative; new public language remains subject to review.", "category": "Strategy", "type": "Brand copy", "status": "Proposed — Keith review", "section": "BF-boilerplate"}], "items": [{"id": "brand-purpose", "title": "Purpose — why we exist", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nMake life without alcohol feel more possible, more connected, and more personal.\n\nWHAT THIS MEANS\nPeople deserve room to imagine what life without alcohol could hold, ask honest questions, and find connection without having to fit someone else’s story.\n\nHOW TO USE IT\nThe purpose is the enduring reason behind the brand. Use it to assess ideas, partnerships, experiences, and creative work. It is not a tagline or a claim of clinical effectiveness.\n\nSOURCE BASIS\nE23, E32; V01–V04; Dave’s End game theme supplied October 14, 2026.", "category": "Strategy", "type": "Brand foundation", "status": "Proposed — Keith review", "section": "BF-purpose"}, {"id": "brand-mission", "title": "Mission — what we are here to do", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nHelp people find and embrace life without alcohol through connection, useful perspectives, and support that respects their own story and path.\n\nIN PRACTICE\nCreate useful content. Invite honest conversations. Make room for different experiences. Develop future support thoughtfully, with clear information about what is available and what is still taking shape.\n\nSHORT INTERNAL VERSION\nHelp people build a life without alcohol that belongs to them.\n\nAPPLICATION\nUse the full mission in brand documents, company introductions, and team alignment. The short version is an internal reminder, not an additional approved tagline. “Support” expresses the mission; specific care or services require their own verified description.\n\nSOURCE BASIS\nE09, E23, E32; V01 and V04. The phrase find and embrace life without alcohol draws from Keith’s stated purpose; the full mission is new draft language.", "category": "Strategy", "type": "Brand foundation", "status": "Proposed — Keith review", "section": "BF-mission"}, {"id": "brand-vision", "title": "Vision — the future we want to help create", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nA future where people can see an enjoyable life without alcohol ahead of them—and find connection and support that respect who they are.\n\nTHE AMBITION\nBring a fuller view of alcohol-free living into reach: everyday enjoyment, meaningful relationships, personal agency, and appropriate support. Let community and future residential development contribute to that ambition in ways that are honest about their scope.\n\nHOW IT DIFFERS FROM THE MISSION\nThe mission describes our work. The vision describes the future that work should contribute to. Neither promises a particular outcome for an individual.\n\nSOURCE BASIS\nE20, E32; V01, V03, V04; Dave’s End game theme. Residential and other service ambitions remain future plans.", "category": "Strategy", "type": "Brand foundation", "status": "Proposed — Keith review", "section": "BF-vision"}, {"id": "brand-values", "title": "Values — how we act", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\n1. RESPECT THE WHOLE PERSON\nA person is more than a label, a difficult chapter, or a shared experience with alcohol. Listen before assuming. Respect differences and the decision to keep something personal.\nBehavior: ask how someone wants their story used; get permission before sharing it.\nDecision test: does this preserve the person’s dignity and choice?\n\n2. PAIR OWNERSHIP WITH SUPPORT\nPeople have agency in their own lives. They also deserve help that meets their needs. Accountability should come with empathy and room for professional care.\nBehavior: invite a next step without issuing a verdict or implying someone should do everything alone.\nDecision test: are we encouraging agency without adding blame?\n\n3. PUT CONNECTION FIRST\nBuild relationships around usefulness, participation, and mutual regard. A purchase, public disclosure, or polished story is not the price of belonging.\nBehavior: make resources easy to reach; offer ways to participate quietly; keep merchandise secondary.\nDecision test: would this still be useful to someone who never buys anything?\n\n4. BE HONEST ABOUT THE WORK\nSay what exists, what we know, and what is still developing. Make the strength of a claim match the evidence behind it.\nBehavior: distinguish concept visuals from built spaces, founder experience from professional credentials, and future plans from available services.\nDecision test: could someone reasonably misunderstand what we are offering today?\n\n5. MAKE IT USEFUL, THEN KEEP IMPROVING\nListen, learn, and turn good intentions into things people can use. Question a convention when there is a clear reason, then show the work behind a better approach.\nBehavior: act on feedback, check resources, and explain meaningful changes.\nDecision test: what practical value does this add, and how will we know?\n\nHOW TO USE THE VALUES\nValues guide team conduct, partner choices, editorial decisions, and the experience of the brand. They are behavioral commitments, not claims that a future residential program has already delivered results.\n\nSOURCE BASIS\nE02, E09, E23, E24, E32; V02–V04; confirmed story ownership, community-first direction, and evidence boundaries in hub Sections 4–6.", "category": "Strategy", "type": "Values", "status": "Proposed — Keith review", "section": "BF-values"}, {"id": "brand-positioning", "title": "Positioning — the role we want to occupy", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nINTERNAL POSITIONING STATEMENT\nFor people in recovery and people quietly questioning alcohol’s place in their lives, ZeroBooze is a developing brand and community around life without alcohol. Built from lived experience, it brings together useful perspectives and opportunities for connection while working toward a wider vision for recovery and support. It respects the individual’s ownership of their story and makes room for the everyday life they want to build.\n\nTHE ROLE\nA thoughtful companion and a purposeful builder: help people find something useful now, and be clear about what we are working toward next.\n\nWHAT WE WANT PEOPLE TO UNDERSTAND\nThis began with someone who needed it first.\nThere is room for experiences that look different from his.\nYour story and your choices remain yours.\nLife without alcohol can hold more than the absence of drinking.\n\nCREDIBILITY TO BUILD FROM\nKeith’s lived experience and clearly attributed founder perspective.\nHis stated commitment to helping people find and embrace life without alcohol.\nUseful, source-grounded content and transparent development updates as they are delivered.\n\nDISTINCTION TO DEMONSTRATE\nOwnership with companionship. A community larger than its founder’s story. Everyday life alongside a wider recovery vision. These are strategic directions to make tangible, not independently proven competitive advantages or exclusive claims.\n\nPUBLIC DESCRIPTION\nZeroBooze is a community taking shape around life without alcohol, with room for different stories, useful perspectives, and a path that belongs to you.\n\nSOURCE BASIS\nE18, E23, E29–E32; V01–V04. Uses the hub’s existing working positioning and preserves current-versus-future distinctions.", "category": "Strategy", "type": "Positioning", "status": "Proposed — Keith review", "section": "BF-positioning"}, {"id": "brand-pillars", "title": "Brand pillars — what our messages return to", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nPILLAR 1 — YOUR STORY BELONGS TO YOU\nCore idea: people can share a connection without sharing the same history or identity.\nMessage: your experience matters, and you decide what to share.\nExpression: “Your story is yours. There’s room for it here.”\nUse in: Our Story, founder content, community stories, consent language, invitations to contribute.\nEvidence: founder and community transcripts, used in context; actual consent practices.\nCreative cue: different people and ordinary details; avoid reducing someone to a symbolic recovery portrait.\n\nPILLAR 2 — YOUR PATH, WITH SUPPORT\nCore idea: ownership and companionship belong together.\nMessage: the work is personal, and appropriate support can be part of it.\nExpression: “A next step that’s yours. People to walk with you.”\nUse in: Resources, Inquire, future service explanations, thoughtful calls to action.\nEvidence: clear resource links, a functioning inquiry route, and verified services only when available.\nCreative cue: agency and forward movement; avoid rescue imagery or language suggesting willpower is sufficient.\n\nPILLAR 3 — BELONGING WITHOUT LABELS\nCore idea: connection should not require a purchase, a public declaration, or a prescribed identity.\nMessage: you can start with a question, read quietly, or bring your own perspective.\nExpression: “You don’t need the same story to belong.”\nUse in: The Community, Find Your People, welcome messages, social prompts.\nEvidence: accessible content, optional participation, and respectful handling of submissions.\nCreative cue: natural connection and room to participate at different levels; no invented testimonials or community scale.\n\nPILLAR 4 — A LIFE TO LOOK FORWARD TO\nCore idea: the ambition includes the life someone wants to make room for beyond alcohol.\nMessage: everyday enjoyment, relationships, and personal interests deserve space in the story.\nExpression: “What do you want to make room for?”\nUse in: Living Zero, lifestyle content, editorial themes, and the End game message.\nEvidence: thoughtful everyday content and consented individual experiences; do not imply these prove recovery outcomes.\nCreative cue: credible ordinary moments; warmth and possibility without glossy perfection.\n\nHOW TO APPLY THE PILLARS\nChoose one lead pillar for a module or execution; a supporting pillar can deepen it. Do not force all four into every headline. Values describe how we behave; pillars describe the messages we return to. Mission and vision set their purpose.\n\nEDITORIAL CONTINUITY\nThis four-pillar system refines the earlier working message pillars in hub Section 4. The earlier Build deliberately and Question conventions themes remain important and are now captured primarily in the values Be honest about the work and Make it useful, then keep improving.\n\nSOURCE BASIS\nE09, E23, E24, E32; V01–V04; existing hub Section 4 and Dave’s End game theme. All expression lines are proposed copy, not founder quotations.", "category": "Strategy", "type": "Brand pillars", "status": "Proposed — Keith review", "section": "BF-pillars"}, {"id": "brand-promise", "title": "Brand promise — the standard we set", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nYour story will be respected. Our part will be clear.\n\nWHAT THE PROMISE MEANS\nRespect the person’s perspective, privacy, and agency. Explain what the brand can offer and where its limits are. Make participation an invitation rather than a demand.\n\nWHAT MUST MAKE IT TRUE\nClear consent before a story is published.\nTransparent labels for future plans and available resources.\nA working contact route with accurate expectations.\nUseful content that does not depend on a purchase.\nAppropriate boundaries between community connection and clinical care.\n\nAPPLICATION\nThis is a proposed experience promise and a standard for decisions, not a guarantee of recovery, confidentiality in every system, or individual results. Agree on the practices behind it before adopting it as public promise language.\n\nSOURCE BASIS\nE23, E32; V02–V04; hub attribution, consent, contact-scope, and availability guidance.", "category": "Strategy", "type": "Brand promise", "status": "Proposed — Keith review", "section": "BF-promise"}, {"id": "brand-personality", "title": "Personality — how the brand feels", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nHUMAN\nSpeak to a person. Show interest in their experience. Leave room for uncertainty and for more than one way of describing a life.\n\nCANDID\nSay something clear and true. Avoid dramatizing a story, minimizing difficulty, or polishing away the parts that make it believable.\n\nASSURED\nGive people a useful starting point. Confidence comes from clarity and care, not volume, superiority, or promises we cannot substantiate.\n\nTHOUGHTFUL\nMake deliberate choices about language, imagery, access, and consent. Create a premium feeling through attention and respect.\n\nPURPOSEFUL\nBuild toward something useful. Show progress through concrete decisions and completed work rather than announcing disruption as a personality.\n\nIN ONE SENTENCE\nA candid, thoughtful companion with the determination of a builder.\n\nFOR DESIGNERS\nGive words and people room. Use clear hierarchy, calm pacing, legible type, and deliberate details. Show lived-in human moments and label concept property imagery. The person should remain more important than a visual metaphor.\n\nFOR WRITERS\nWrite with warmth, directness, and restraint. Let a specific observation carry the feeling. Avoid motivational speeches, corporate polish, and a heroic founder narrative that crowds out the visitor.\n\nSOURCE BASIS\nE10, E18–E19, E23–E25, E32; hub Sections 2 and 4. This translates the source direction into a proposed personality system.", "category": "Strategy", "type": "Brand personality", "status": "Proposed — Keith review", "section": "BF-personality"}, {"id": "brand-voice", "title": "Voice & tone — how we put it into words", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nVOICE\nConversational, direct, warm, and sure of itself. Write to one person. Use natural paragraphs and specific language. Make a next step understandable without pressuring someone to take it.\n\nFOUR WRITING RULES\n1. Start with recognition. A question or an ordinary moment can create an opening without assuming someone’s history.\n2. Respect agency. Use invitations and choices; do not assign labels or decide what someone’s experience means.\n3. Put something useful within reach. Give a clear destination, a practical perspective, or an honest answer.\n4. Let the wording match the facts. A future idea is a future idea. A personal experience is not a universal result.\n\nTONE BY SITUATION\nWelcome: open and unhurried. “Start where it feels right.”\nQuiet concern: gentle and specific. “You can begin with a question.”\nFounder story: candid and personal, then turn toward the visitor.\nResources: practical and clear, with sources where needed.\nThe House: thoughtful and concrete; retain development status until facts change.\nInquiries: warm and straightforward about response and scope.\nRecruitment and partnerships: purposeful, factual, and clear about what is defined.\n\nBEFORE AND AFTER\nInstead of: “Embark on a transformative journey.”\nUse: “Find a next step that makes sense for you.”\n\nInstead of: “We know exactly how you feel.”\nUse: “Your experience may be different. There’s room for it here.”\n\nInstead of: “Take control. No excuses.”\nUse: “Your choices matter. So does the support around you.”\n\nInstead of: “Our revolutionary approach changes lives.”\nUse: “Here’s what we’re developing, and why it matters.”\n\nInstead of: “Join our thriving community.”\nUse: “Explore the community taking shape.”\n\nLANGUAGE RULES TO RETAIN\nZeroBooze: one word, capital Z and B.\nResident Guests in residential contexts; people or community members elsewhere.\nPath, recovery, relief, support, ownership, connection, and life without alcohol.\nThe House for the current website’s planned residential setting; avoid facility and campus in new brand copy.\nUse Quietly Concerned internally rather than assigning that label to a visitor.\nDo not use the word list to manufacture operational facts or outcome claims.\n\nSOURCE BASIS\nE10, E18–E19, E23–E25, E32, E39; confirmed naming and Resident Guests updates from Dave, October 14; October 20 website navigation brief.", "category": "Strategy", "type": "Voice guide", "status": "Proposed — Keith review", "section": "BF-voice"}, {"id": "brand-manifesto", "title": "Manifesto — the belief in full", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nThere is a life to be lived without alcohol.\n\nA life with your own reasons, your own questions, and things you want to make room for. A conversation that stays with you. Time for something you enjoy. People you can be yourself around.\n\nYou may have been living that life for years. You may be doing the work of recovery. You may be quietly wondering what needs to change. You do not need to make your story look like someone else’s before it matters.\n\nZeroBooze began with someone who needed it first. Keith’s experience gave him a reason to build. The purpose reaches beyond one person, because a shared connection should have room for many different lives.\n\nWe believe your story belongs to you. You decide what to share, what to keep personal, and which questions you are ready to ask.\n\nWe believe ownership and support belong together. Making a choice for yourself can include asking for help. The people who walk beside you and the care that fits your needs can be part of a path that remains your own.\n\nWe want connection to come before a transaction. Useful perspectives should be within reach. A purchase or a public declaration should never be the price of being welcomed.\n\nAnd we believe good intentions need honest work behind them. We will be clear about what we can offer, what is still developing, and where we need to listen, learn, and do better.\n\nThe ambition is an enjoyable life without alcohol. Not a picture of perfection, but room for ordinary good moments, meaningful relationships, and possibilities that feel like yours.\n\nYour story. Your path.\n\nLet’s make room for what comes next.\n\nUSAGE NOTE\nThis is newly written brand copy for review, not a quotation from Keith or a clinical promise. Use as the long-form belief statement in brand presentations, internal orientation, or a considered editorial module. The closing lines are proposed expressions, not approved logo lockups.\n\nSOURCE BASIS\nE09, E18, E23, E32; V01–V04; Dave’s End game theme. New manifesto language synthesized from these themes.", "category": "Strategy", "type": "Brand manifesto", "status": "Proposed — Keith review", "section": "BF-manifesto"}, {"id": "brand-message-map", "title": "Message hierarchy — what to lead with", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nFIRST: THE HUMAN INVITATION\nLife without alcohol. A path that’s yours.\nHelp someone understand the brand and see a place for their experience.\n\nSECOND: THE BELIEFS\nYour story belongs to you. Ownership can include support. Connection makes room for differences. Everyday life deserves a place in the picture.\n\nTHIRD: SOMETHING TANGIBLE\nAn article to read, an attributed founder perspective, a functioning way to inquire, or a clearly described development update. Let the action match what exists.\n\nFOURTH: THE WIDER VISION\nIntroduce The House and future support with transparent availability language. Do not let future scale or investor ambition crowd out the visitor’s immediate question.\n\nBY WEBSITE PAGE\nThe House: Your path, with support; show development status.\nThe Community: Belonging without labels; make room for different experiences.\nLiving Zero: A life to look forward to; show ordinary, credible possibilities.\nOur Story: Your story belongs to you; Keith’s origin opens the door to other voices.\nThe Pledge: connect the values to commitments the brand can stand behind.\nFind Your People: offer a clear, deliverable way to connect.\nResources: make the next useful perspective easy to find.\nInquire: make the invitation warm, usable, and clear about scope.\n\nBY AUDIENCE\nPeople in recovery: agency, respect, and support; no promises of results.\nPeople quietly concerned: recognition and a manageable invitation; no required label or public disclosure.\nPeople living without alcohol for years: connection, contribution, and respect for experience.\nPeople exploring alcohol-free living: room for different reasons.\nLoved ones: listen, learn, respect the individual’s choices, and maintain appropriate boundaries.\nProfessional partners and future team members: purpose plus verified scope, roles, and evidence.\n\nDO NOT CONFUSE THE LAYERS\nPurpose: why the brand exists.\nMission: the work it is here to do.\nVision: the future it wants to contribute to.\nValues: how it behaves.\nPillars: the themes its communications return to.\nPromise: the experience standard it sets.\nManifesto: a fuller expression of the belief.\nA campaign theme: a specific creative expression built from this foundation, not a replacement for it.\n\nSOURCE BASIS\nHub Sections 3, 4, 6, 8 and 19; Dave’s October 20 navigation brief. Proposed application guidance.", "category": "Strategy", "type": "Messaging", "status": "Proposed — Keith review", "section": "BF-message-map"}, {"id": "brand-boilerplate", "title": "Brand story & reusable descriptions", "body": "PROPOSED BRAND FOUNDATION — October 26, 2026\nNew strategic language for Keith’s review. Informed by the source hub and confirmed brand rules; not a verbatim founder statement or a claim that future services are operating.\n\nBRAND STORY\nZeroBooze began in the early days of Keith Polaski’s sobriety, when his own experience gave him a reason to build something more personal.\n\nHe wanted to turn what he was learning into something useful for others: a place for connection, honest perspectives, and questions about life without alcohol.\n\nThe belief behind it reaches beyond his own story. People have different histories and different reasons for change. They should be able to find something that speaks to them without being asked to become someone else.\n\nToday, ZeroBooze is a brand and community taking shape around that belief, with a wider vision for recovery and support. Its purpose is to make room for the individual and for the life they want to build.\n\nONE-SENTENCE DESCRIPTION\nZeroBooze is a community taking shape around life without alcohol, built from lived experience and with room for different stories and paths.\n\nSHORT DESCRIPTION\nZeroBooze began with Keith Polaski’s own experience of sobriety and a wish to build something useful for others. It brings together perspectives, resources, and invitations to connect around life without alcohol, while developing a wider vision for recovery and support.\n\nREUSABLE OPENING\nYou don’t have to have it all figured out. You can start with a question, a story, or something useful to read.\n\nEXPRESSIONS TO EXPLORE\nYour story. Your path.\nLife without alcohol. Room to make it yours.\nWhat do you want to make room for?\n\nEDITORIAL STATUS\nDescriptions are proposed copy. Founder history requires Keith’s approval for public use. Descriptive lines are not assumed approved taglines. Keep future residential and clinical offerings clearly identified as plans.\n\nSOURCE BASIS\nE18, E23, E32; W02; V01–V04. Uses established hub narrative; new public language remains subject to review.", "category": "Strategy", "type": "Brand copy", "status": "Proposed — Keith review", "section": "BF-boilerplate"}, {"id": "brand-name", "title": "Brand name & spelling", "body": "CONFIRMED BRAND RULE — October 14, 2026\n\nThe brand name is ZeroBooze.\n\nWrite it as one word, with a capital Z and a capital B. Use this exact spelling in headlines, body copy, navigation, captions, buttons, bios, presentations, and other brand communications.\n\nCorrect: ZeroBooze\nAvoid separating the name into two words or using all-lowercase or all-capital lettering in typeset text.\n\nSource: Dave’s confirmed naming direction, October 14, 2026. This supersedes earlier naming and spelling questions in the hub.\n\nThe hub’s text and displayed source labels have been standardized to the confirmed spelling. Original source files and approved logo artwork retain their supplied filenames and artwork; source links still point to the original records.", "category": "Strategy", "type": "Brand rule", "status": "Confirmed direction", "section": "25"}, {"id": "section-1", "title": "How to use this hub", "body": "This is the central working record for ZeroBooze’s brand, website, social, marketing, partnerships, sales, recruitment, and community communications. It starts from the client’s intent, rather than assuming the current site or earlier drafts are the answer.\n\n\nEvidence labels:\nCONFIRMED DIRECTION: an explicit statement by Keith in an email or his September notes.\nCOLLABORATOR PROPOSAL: a recommendation from Dustin or another contributor, without assuming Keith approved it.\nINTERPRETATION: our reading of the pattern across sources.\nPROPOSED COPY: new language written for review.\nFUTURE / UNVERIFIED: a plan or claim that cannot yet be presented as an available service or established result.\n\n\nEach strategic point and copy module includes source IDs. The source register at the end identifies the email files and links back to them. Dates cited in the discussion are the original conversation dates, rather than simply the October forwarding dates.\n\n\nCoverage: the message text and forwarded conversations in 39 individual email files; Keith’s September 2026 DOCX attachment; the Anti Talking Points PDF attachment; the current website’s homepage, founder story, notebook, and store preview; and all four supplied video transcripts. Sections 21–23 add transcript-based social content and Keith’s bio. Design files, photographs, legal agreements, and other embedded attachments have not all been visually reviewed. Transcript wording is source material; actual recordings, clip timecodes, and picture edits still require verification.\n\n\nLater additions should record source, owner, date, audience, channel, availability status, copy status, and approval. Preserve earlier decisions in the decision log when direction changes.", "category": "Strategy", "section": "1", "type": "Reference", "status": "Working reference"}, {"id": "section-2", "title": "What Keith is trying to build", "body": "CONFIRMED DIRECTION\nZeroBooze is bigger than merchandise. Keith wants empathy and support, acknowledgment of the individual in each story, and navigation toward life without alcohol. He describes the ambition as the “Waze” of sobriety. Community and in-residence development should move in parallel, on different timelines. [E32 attachment, Sept. 12]\n\n\nHis priority audiences are the Recovering and the Quietly Concerned. People own their story and their path. Accountability matters, but the tone should carry it subtly and deliberately. His central distinction: ZB cannot do the work FOR someone, but can do it WITH them. [E32]\n\n\nHe wants community participation, shared stories, eventual gatherings, useful resources, and invitations to help shape the brand. Merchandise remains available for those who want it; it is ancillary. [E09, July 7; E32]\n\n\nHe wants the brand to feel premium, conversational, and clear without being in someone’s face. Softness does not come naturally to him; he explicitly asks for help balancing his directness. He wants the founder story early, while preserving the feeling that this is about the visitor. [E32]\n\n\nINTERPRETATION\nKeith is a builder who wants lived experience to lead to useful change. His frustration with familiar recovery conventions fuels ambition, but his strongest public message is practical companionship and personal ownership. “Disruption” should be demonstrated by concrete choices and evidence as they develop.\n\n\nThe brand needs two speeds: a clear, useful community experience people can enter now, and a longer-term vision with transparent milestones. A visitor should not have to decipher which is which. [E20, E25, E29–E30, E32; W01–W03]\n\n\nWORKING POSITIONING — proposed\nZeroBooze is a community taking shape around life without alcohol, built from lived experience and grounded in the belief that you own your story and your path. It brings people, perspectives, and useful resources together, while working toward a broader future in recovery and support. [E09, E23, E32]\n\n\nSHORT DESCRIPTION — proposed\nLife without alcohol. Your story. Your path. A community to walk with you.\n\n\nUse that as descriptive copy, not an assumed approved tagline. Keith agreed that the name can stand alone. [E25, Aug. 28]", "category": "Strategy", "section": "2", "type": "Reference", "status": "Working reference"}, {"id": "section-3", "title": "Audience priorities", "body": "The Recovering — primary\nKeith defines this audience as day one through five years in his internal notes. Their need: continued support, useful next steps, and a connection beyond a single episode of care. Message: you are doing the work; you do not have to navigate every part alone. Avoid making the five-year boundary a public clinical definition. [E32]\n\n\nThe Quietly Concerned — primary\nPeople at the doorstep of change who have not taken that step. Their need: recognition, privacy, and a manageable invitation. Message: you can start with a question. Do not assume they identify with recovery or publicly disclose concerns. [E25, E23, E32]\n\n\nThe Recovered — secondary\nKeith’s internal definition is five-plus years. Their need: identity, connection, contribution, and respect for experience. Message: your perspective can help someone find their next step. Avoid suggesting they have crossed a universal finish line. [E32]\n\n\nThe Sober Curious — secondary\nPeople considering alcohol-free living, including for health or lifestyle reasons, without assuming an abuse history. Message: there is room for your reason. [E23, E32]\n\n\nAdditional communication audiences — proposed\nLoved ones seeking a way to support someone; professionals and referral partners assessing credibility; potential employees and collaborators; partners and donors; investors considering the future residential vision. These require different proof and calls to action. Do not make investor ambition the homepage’s primary message.\n\n\nDecision history\nDustin’s July 7 recommendation emphasized people already living without alcohol and deferred sober curious outreach. Keith’s September notes broadened the model and explicitly prioritized the Recovering and Quietly Concerned. The September notes guide this draft. [E09 → E25/E23 → E32]", "category": "Strategy", "section": "3", "type": "Reference", "status": "Working reference"}, {"id": "section-4", "title": "Source foundation — earlier voice & message pillars", "body": "SOURCE AND DECISION HISTORY\nThis earlier working interpretation is preserved for reference. The proposed October 26 Brand pillars and Voice & tone modules provide the current organized system for review. No client approval is implied.\n\nVOICE — proposed application of Keith’s direction\nConversational, direct, warm, and sure of itself. Use short clear sentences alongside natural paragraphs. Address a person rather than a demographic category. Make room for uncertainty without sounding vague. Offer participation without demanding disclosure. Use empathy with accountability; do not moralize or promise to save anyone. [E10, E18–E19, E23–E25, E32; W02]\n\n\nPILLAR A: Your story belongs to you\nYou own your story and your path. Different histories can share a common connection without being flattened into the founder’s experience. [E23, E32; W03]\nUse in: homepage, About, invitations to share, community guidelines.\n\n\nPILLAR B: We can walk with you\nSupport and useful navigation accompany personal effort. Make the next step feel approachable and specific. [E32]\nUse in: Resources, Contact, support descriptions, after-care communications when a service exists.\n\n\nPILLAR C: Belonging comes first\nCommunity is a priority, not a by-product of shopping. Merchandise expresses connection; purchasing is not a condition of participation. [E09, E22, E32]\nUse in: homepage order, Store, email welcome, social.\n\n\nPILLAR D: Build deliberately; show the work\nThe brand is in development. Updates, questions, and milestones can make progress visible and invite collaboration. [E24, E32; W03]\nUse in: Horizon, notebook, recruitment, investor materials.\n\n\nPILLAR E: Question conventions with care\nChallenge assumptions about the experience of recovery, with specific reasons and substantiation. Lead with what improves life for the individual. [E02, E25, E29]\nUse in: thought leadership and program development; avoid unsupported comparisons in public sales copy.\n\n\nRecognition, permission, and relief are a useful editorial test proposed by Dustin, not a documented final emotional choice by Keith. Pair that test with Keith’s explicit “empathy and support.” [E19 vs. E32]\n\n\nBEFORE / AFTER — editorial examples\nGeneric: “Embark on an inspiring journey.”\nProposed: “Find a next step that makes sense for you.”\nGeneric: “We will transform your life.”\nProposed: “You own the work. We want to help you find the people and resources to support it.”\nGeneric: “Our facility treats patients.”\nProposed future description: “Our planned residence will be shaped around the people who come here for recovery.”", "category": "Strategy", "section": "4", "type": "Source reference", "status": "Earlier working draft"}, {"id": "section-5", "title": "Keith’s language guide", "body": "Source: E39, ZB Anti Talking Points PDF. These are Keith’s preferred contrasts, recorded faithfully. They are an internal direction list, not evidence that planned clinical offerings or outcomes exist.\n\n\nAvoid → Keith’s preferred wording\nTreatment → Relief / Recovery\nJourney → Path\nOne Day at a Time → Your own Horizon\n“AA” Foundation → Ownership Foundation\nTraditional / Accepted Treatment → Disruption Treatment\nPatients → Resident Guests\nAlcoholism → Abuse\nInspire → Self-Realization\n30 Days & 60 Days → 45 Days & 75 Days\nAcceptance → Admission\n12% Outcome → 35% Outcome (3X)\nSelf-Serve Post Care → Administered Post Care\nStatic / Accepted Modalities → Disruption Modalities\nGroups → Community\nInsurance Pay → High Self-Pay\nProfit Focused → Success Focused\nVarying Residential Rules → Regimented Residential Rules\n\n\nAdditional explicit preferences\nFacility: avoid in public brand language; Dave’s current brief confirms this preference. Proposed replacement: “Our Residence,” subject to confirming there is a single residential property. “Our Spaces” works if the page covers several locations or nonresidential settings.\nQuietly Committed: superseded by Quietly Concerned. [E25, E23, E32]\n“Live inside”: Keith questioned it; use experience, commonality, expression, or support instead. [E23]\nRoad: Keith explicitly asks to replace it with path. [E32]\n“Inspire / Journey / Celebrate” as a logo lockup: challenged by Dustin, followed by Keith’s pivot toward the name alone. [E15, E25]\n“Celebrating Sobriety, Inspiring Recovery”: considered, then set aside; not the default tagline. [E21, E25]\n\n\nHOW TO APPLY\nPrefer recovery, relief, support, path, ownership, community, and life without alcohol. “Resident Guests” belongs in an actual residential context; use person, community member, or participant elsewhere. Avoid defining someone as “an abuser.” Even though “Abuse” appears on Keith’s list, person-centered plain language often removes the need for a label.\n\n\nThe list is not a mechanical word-replacement tool. “Admission” can mean entering a program; do not replace emotional acceptance everywhere. “Disruption Treatment” still uses a word Keith otherwise dislikes, so retain that exact contrast in the internal register while writing public copy around the specific approach.\n\n\nDo not convert 45/75-day plans, self-pay positioning, administered post care, residential rules, or numerical outcomes into current service facts. All require operational confirmation. The 12% / 35% / 3X line is an unverified claim and is excluded from public copy.\n\n\nRespect different approaches to recovery. Ownership is the brand’s organizing idea; it does not establish that the brand rejects all spiritual or peer-support options. The PDF’s appendix describes several alternatives with differing philosophies, including 12-step approaches. Do not copy that appendix as verified current resource guidance without checking the original providers.\n\nLATEST LANGUAGE UPDATE — October 14, 2026\nDave’s direction: Patients is wording to avoid; Resident Guests is the preferred wording. This supersedes the earlier Patient → Resident entry. Use the residential term in the appropriate context.\n\nBRAND NAME — confirmed October 14, 2026\nAlways write ZeroBooze as one word, with a capital Z and B. See the Brand name & spelling module.", "category": "Strategy", "section": "5", "type": "Reference", "status": "Working reference"}, {"id": "section-6", "title": "Decisions, tensions, and evidence boundaries", "body": "DECISIONS TO CARRY FORWARD\nCommunity is a priority. [Keith, E09, July 7]\nLet ZeroBooze stand on its own; the tagline discussion has changed. [Keith, E25, Aug. 28; E21 forwarding note]\nUse Quietly Concerned and prioritize that audience alongside the Recovering. [Keith, E23/E32, Sept. 4/12]\nKeep merchandise secondary. [Keith, E32]\nUse conversational copy with deliberate accountability. [Keith, E32]\nDevelop community and residential ambitions in parallel on different timelines. [Keith, E32]\nUse opt-in updates and communications. [Keith, E32]\nAllow both Gratitude and Interview in Progress to coexist as personal practices. [Keith, E13, Sept. 19]\nPreserve a Horizon space for future ambitions. [Keith, E20, Sept. 7]\n\n\nTENSIONS TO RESOLVE THROUGH DESIGN AND COPY\nQuiet public voice versus “let’s break things” internal energy: keep the public welcome calm; demonstrate challenge through substantive content. [E25/E32]\nFounder authenticity versus a community larger than one person: use Keith’s story to open the door, then turn toward the visitor and other voices. [E22/E32]\nLifestyle brand versus residential provider: one brand can connect them, but available services and future plans must be unmistakable. Dustin suggested separate sites; Keith later emphasized parallel efforts. Architecture remains a decision, not a settled mandate. [E30/E32]\nPrivacy versus direct access: Keith wants a brand-facing conversation channel, not his personal number prominently displayed. Verify workflow and response expectations before activating it. [E32; W01]\nPremium versus accessible: dignity and clarity should create the premium feeling without implying everyone must shop or afford residential care.\n\n\nCLAIMS HELD FROM PUBLIC COPY\nClaims about the historical origin of 28-day programs: present in E25/E29, not independently substantiated here.\nNumerical recovery outcomes and “3X”: present in E39, no definition, denominator, follow-up period, or supporting evidence supplied.\nMarket-size, alcohol-cancer awareness, competitor revenue, and closure assertions in E17: research leads, not approved proof points.\nSpecific advocate identities and willingness to participate: E03 is too ambiguous to establish an endorsement.\nClinical modalities, staffing, licenses, accreditations, program eligibility, pricing, insurance terms, residence location, opening date, and availability: not confirmed for launch.\nShock Pulse Medical: separate venture in E07/E35/E36. Do not imply its technology or services are part of ZeroBooze without an explicit decision and evidence.", "category": "Strategy", "section": "6", "type": "Reference", "status": "Working reference"}, {"id": "section-7", "title": "Current website review", "body": "Reviewed October 13, 2026 at https://zerobooze.life/ through the visible site.\n\n\nW01 — Homepage\nCurrent lead: “You remember the moment.” Describes a brand taking shape around life without alcohol. Includes founder story, community, notebook, hat, and conversation invitation. Retain the human welcome and room for different experiences; make the purpose clearer sooner. The opening assumes a defining moment, which may fit less well for sober curious visitors.\n\n\nW02 — Founder story, https://zerobooze.life/story\nCurrent title: “I’m still in it.” The story acknowledges alcohol’s effects, prior attempts at change, choosing care, and building ZeroBooze while still in recovery. Keep its candor. Replace dated early-recovery timing and confirm personal details before republication. The personal thank-you names family and supporters; retain only with Keith’s approval of placement and wording. Use “recovery” rather than “treatment” in new brand copy while preserving exact quoted source records.\n\n\nW03 — Keith’s Notebook, opened from homepage\nTopics: common denominator across different histories; development of a first center in Florida; and the need for clinical, design, and construction expertise. It expressly states the center is not open. Preserve that availability distinction. These entries corroborate a development effort, not an operational residence.\n\n\nCurrent site limitation\nTexting is explicitly a preview and is not connected. Do not publish “Text ZeroBooze” as a working action until verified. Navigation and page structure differ from the requested new sitemap.\n\n\nThis review is a baseline, not a commitment to reuse the current design or all copy. The website draft below rebuilds the message around the primary audiences and Keith’s later direction.\n\n\nW04 — Store, https://zerobooze.life/merch\nThe visible collection preview lists hat, cap, visor, tumbler, polo, jug, and clear tumbler. It expressly says products, prices, and options are proposed for review and purchases are not enabled. The repeated $35 display is not adopted as approved pricing. Confirm the catalog, stock, fulfillment, and checkout before publishing Store copy.", "category": "Strategy", "section": "7", "type": "Reference", "status": "Working reference"}, {"id": "section-8", "title": "Recommended website architecture", "body": "Recommended main navigation:\nAbout | Our Residence | Services | Resources | Store | Contact\nHome is reached through the logo. Add Horizon as a visible secondary link and a prominent homepage module.\n\n\nHome: explain what ZeroBooze means, invite the priority audiences, introduce community and Keith, and offer a useful next step.\nAbout / Our Story: the belief, founder origin, audience, and approach. Prefer a personal story to a conventional resume bio. [E18, E29–E30, E32]\nOur Residence: proposed replacement for Facility. While development continues, this page describes the intention and progress; it must not resemble an admissions page.\nServices: show available ways to engage first; label any clinical or residential offerings in development. If no services are operational, consider “Support” for the public navigation, with “Services” retained as the working sitemap label.\nResources: practical guidance, selected links, shared experiences, and the ongoing notebook. Proposed notebook label: “Along the Path.” Keith asked to reconsider “Notebook”; this label is a recommendation, not his approved wording. [E32]\nStore: merchandise and expression, with truthful product information and clear fulfillment policies.\nContact: a modest, usable invitation for general inquiries, stories, partners, and recruitment.\nHorizon: future centers, resources, virtual support, beverages/nutrition, and a charitable foundation, without implying launch dates. [E20, E39]\n\n\nPrimary conversion recommendation: a conversation or optional updates, supported by useful Resources. Buying is secondary. Keith’s stated goal is helping people live without alcohol and tell others, with traffic and positive feedback as early signals. [E32]\n\n\nCopy below is PROPOSED COPY. Editorial notes and source notes are not part of the public pages. Bracketed facts are missing inputs, not text to publish.", "category": "Strategy", "section": "8", "type": "Reference", "status": "Working reference"}, {"id": "section-9", "title": "Website copy — Home", "body": "HERO\nLife without alcohol.\nA path that’s yours.\n\n\nZeroBooze began with someone who needed it first. We’re building a community for people living without alcohol, people finding their way toward it, and people beginning to ask what might change.\n\n\nYour story is yours. There’s room for it here.\n\n\nPrimary button: Explore Resources\nSecondary button: Meet ZeroBooze\n\n\nSources / status: proposed from E23/E32, supported by E09/E19. “Community” is an ambition in development; verify the actual participation experience before launch.\n\n\nCOMMUNITY MODULE\nYou don’t have to have it all figured out.\n\n\nMaybe you’re in recovery. Maybe something about your drinking has been on your mind. Maybe you’ve chosen life without alcohol for a reason entirely your own.\n\n\nWe want ZeroBooze to be a place to find useful perspectives, make a connection, and take a next step on your terms.\n\n\nButton: Start a Conversation\nSources: E23/E32. Activate only with a working channel.\n\n\nFOUNDER MODULE\nBuilt from a life. Built for more than one.\n\n\nKeith Polaski started ZeroBooze in the early days of his own sobriety. His experience is where this began. It’s also why we want to make room for stories that look nothing like his.\n\n\nButton: Read Our Story\nSources: E18/E23/E32; W02.\n\n\nRESOURCES MODULE\nSomething useful for your next step.\n\n\nPersonal reflections. Practical questions. Resources worth exploring. We’re bringing them together to help you navigate life without alcohol in a way that makes sense for you.\n\n\nButton: Visit Resources\nSources: E20/E32. Publish after initial resources are curated.\n\n\nHORIZON MODULE\nWe’re building what comes next.\n\n\nCommunity is the starting point. Our longer-term vision includes places for recovery, more ways to connect with support, and experiences that bring life without alcohol into everyday living.\n\n\nThese plans are taking shape. We’ll share progress as they develop.\n\n\nButton: See Our Horizon\nSources: E20/E32/E39; W03.\n\n\nSTORE MODULE\nCarry something that means something to you.\n\n\nZeroBooze merchandise is one way to express a connection. Wear it with pride, keep it personal, or let it start a conversation. There’s room for all of it.\n\n\nButton: Explore the Store\nSources: E22/E32. No purchase required for community participation.\n\n\nUPDATES MODULE\nStay connected as ZeroBooze grows.\n\n\nGet new reflections, useful resources, and updates on what’s taking shape. Choose to hear from us. Unsubscribe whenever you want.\n\n\nField: Email address\nButton: Keep Me Updated\nSources: E24/E32. Confirm privacy notice and working opt-in flow.\n\n\nSEO — proposed\nTitle: ZeroBooze | Life Without Alcohol, Your Story, Your Path\nDescription: Meet ZeroBooze, a community taking shape around life without alcohol. Explore our story, useful resources, and the vision we’re building together.", "category": "Website copy", "type": "Page copy", "status": "Proposed copy", "section": "9"}, {"id": "section-10", "title": "Website copy — About", "body": "HERO\nOur story starts with Keith.\nIt makes room for yours.\n\n\nZeroBooze was born in the early days of Keith Polaski’s sobriety, from a need he knew firsthand: a way to connect, find something useful, and build a life without alcohol that belonged to him.\n\n\nThat experience started the brand. The belief behind it reaches further. You own your story. You own your path. Support should respect both.\n\n\nSources: E18/E23/E32; W02.\n\n\nOUR BELIEF\nWe can walk with you.\n\n\nThe work of change is personal. No brand can do it for you. But connection can matter. So can a perspective you hadn’t considered, a resource you can use, or a conversation you didn’t know how to start.\n\n\nWe’re building ZeroBooze around those possibilities. A community shaped by different experiences, with empathy, personal ownership, and a willingness to keep asking what would help.\n\n\nSources: E09/E19/E32.\n\n\nKEITH’S STORY — first-person draft for Keith’s review\nI’ve spent much of my life building businesses. For a long time, alcohol was part of that life too. At work. At celebrations. On hard days. Eventually, more and more of it happened alone.\n\n\nI kept showing up. I kept building. I told myself that meant I was in control. It became harder to be honest about what alcohol was costing me and the people closest to me.\n\n\nWhen I chose to seek help, I was scared. Recovery asked me to look at myself differently. It also gave me a reason to think about what I wanted to build next.\n\n\nZeroBooze began there.\n\n\nI’m still doing the work. I’m sharing my experience because someone else may recognize part of their own. Your life may look very different from mine. Your reasons may be different too.\n\n\nWhat I want to build is something useful: a place for connection, resources, and honest conversations about life without alcohol.\n\n\nI can’t do the work for you. I hope we can walk some of the path together.\n\n\nKeith Polaski\nFounder, ZeroBooze\n\n\nSources: adapted from W02 and the origin draft in E18, with E32’s ownership principle. This is proposed founder copy, not a verbatim statement or approved personal disclosure. Confirm personal history and present-day wording with Keith.\n\n\nWHO THIS IS FOR\nFor people in recovery.\nFor people quietly concerned about their drinking.\nFor people who have lived without alcohol for years.\nFor people curious about a different way to live.\n\n\nYou don’t need the same history to find a connection.\n\n\nButton: Explore Resources\nSecondary button: Share a Note\nSources: E23/E32.\n\n\nSEO — proposed\nTitle: About ZeroBooze | Our Story and Belief\nDescription: Learn why Keith Polaski started ZeroBooze and how personal ownership, empathy, and community shape its vision for life without alcohol.", "category": "Website copy", "type": "Page copy", "status": "Proposed copy", "section": "10"}, {"id": "section-11", "title": "Website copy — Our Residence", "body": "Editorial status: DEVELOPMENT COPY. This page replaces “Facility” in the proposed sitemap. Do not publish specific features, services, admissions information, or renderings as completed facts. “Our Residence” requires confirmation that one property is the intended scope.\n\n\nHERO\nA place for recovery.\nBuilt around the person.\n\n\nWe’re working toward a ZeroBooze residence where personal ownership, meaningful support, and community can shape the experience of recovery.\n\n\nThe plans are still developing. The residence is not open, and we are not accepting residents through this page.\n\n\nSources: E25/E32/E39; W03. Operational status must be reconfirmed before publication.\n\n\nTHE INTENTION\nStart with what would help.\n\n\nA place for recovery should be shaped by the people who come there. Their lives. Their questions. The work they’re ready to do. The support that continues to matter when they leave.\n\n\nThat is the intention guiding this development. As decisions become real, we’ll explain what the residence will offer, who it will serve, and how the experience will work.\n\n\nSources: E32/E39; W03. Not a promise of a defined care model.\n\n\nPROGRESS MODULE\nFrom intention to a place.\n\n\nWe’ll share meaningful milestones as the work develops: site decisions, design progress, the people shaping the approach, and confirmed information about opening.\n\n\nButton: Follow Our Progress\nSecondary button: Ask About the Vision\nSources: E39 milestones; W03.\n\n\nFUTURE CONTENT REQUIRED\n[Verified location and address]\n[Approved architectural imagery, labeled as renderings]\n[Opening status and date, if established]\n[Residential program eligibility and scope]\n[Licensing, accreditation, and clinical leadership]\n[Accessibility, accommodation, and verified amenities]\n[Program duration and after-care arrangements]\n\n\nSEO — proposed\nTitle: Our Planned Residence | ZeroBooze\nDescription: Explore ZeroBooze’s vision for a residence shaped around personal ownership, recovery, and community. Follow development updates as plans take shape.", "category": "Website copy", "type": "Page copy", "status": "In development", "section": "11"}, {"id": "section-12", "title": "Website copy — Services", "body": "Editorial status: AVAILABLE SUPPORT + FUTURE PLANS. Confirm e
